# In Coolify, set per-service domains in the UI:
#   backend  -> https://<host>/api  (turn OFF "Strip Prefix")
#   frontend -> https://<host>
# Local dev port publishing lives in docker-compose.override.yml.

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      POSTGRES_USER: ldvelh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ldvelh}
      POSTGRES_DB: ldvelh
      POSTGRES_SERVER_CN: db  # matches the service name used by clients
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (not /data).
      - pgdata:/var/lib/postgresql
      - db-certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldvelh"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ldvelh:${DB_PASSWORD:-ldvelh}@db:5432/ldvelh?sslmode=verify-ca&sslrootcert=/certs/rootCA.crt
      FRONTEND_URL: ${SERVICE_URL_FRONTEND}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-true}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@ldvelh.local}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-devpassword}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - db-certs:/certs:ro

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  db-certs:
