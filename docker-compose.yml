services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    # on-failure with cap so a broken db doesn't spam logs forever. Once it's
    # running and healthy, restarts are caused only by crashes (real bugs) —
    # 3 tries is enough to recover from transient failures.
    restart: on-failure:3
    environment:
      POSTGRES_USER: ldvelh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ldvelh}
      POSTGRES_DB: ldvelh
      # CN of the server cert — must match what clients connect to inside the
      # compose network. "db" works because that's the service name.
      POSTGRES_SERVER_CN: db
    volumes:
      # Postgres 18+ uses /var/lib/postgresql as the mount root; the actual
      # data lives in a major-version subdir (e.g. /var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      - db-certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldvelh"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # sslmode=verify-ca: validate the CA but skip hostname check (the cert
      # CN is "db" which works in this compose network but not for direct
      # external psql connections — verify-full would be stricter).
      # sslrootcert points to the CA cert generated by the db container and
      # exposed via the shared volume.
      DATABASE_URL: postgresql://ldvelh:${DB_PASSWORD:-ldvelh}@db:5432/ldvelh?sslmode=verify-ca&sslrootcert=/certs/rootCA.crt
      # In prod: Coolify auto-injects SERVICE_URL_FRONTEND from the domain
      # configured on the frontend service (e.g. https://dev.inkrealm.fr).
      # In local dev: override.yml sets FRONTEND_URL to http://localhost:3000.
      FRONTEND_URL: ${SERVICE_URL_FRONTEND}
      # CORS may need multiple comma-separated origins later (mobile, admin
      # domain, etc.), so keep it as its own env var rather than derive it.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-true}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@ldvelh.local}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-devpassword}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      # Read-only: backend just needs to verify the CA, never write certs.
      - db-certs:/certs:ro
    # No `ports:` here on purpose — in production Coolify's Traefik proxy
    # talks to this container via the Docker network. For local dev, see
    # docker-compose.override.yml which adds host-port publishing.
    # Traefik routing: this backend has NO public domain of its own. It is
    # reached only via /api/* on the frontend's hostname. The PathPrefix
    # match passes the full path (including /api) through — no stripprefix
    # middleware — so the FastAPI routes mounted at /api/* match correctly.
    # FRONTEND_HOST must be set in Coolify env (e.g. dev.inkrealm.fr).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${SERVICE_FQDN_FRONTEND}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=https"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  db-certs:
