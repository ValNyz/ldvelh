services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ldvelh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ldvelh}
      POSTGRES_DB: ldvelh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldvelh"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ldvelh:${DB_PASSWORD:-ldvelh}@db:5432/ldvelh
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-true}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@ldvelh.local}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-devpassword}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
