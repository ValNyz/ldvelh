# In Coolify, set per-service domains in the UI:
#   backend  -> https://<host>/api  (turn OFF "Strip Prefix")
#   frontend -> https://<host>
# Fail-closed: JWT_SECRET, DB_PASSWORD and ENCRYPTION_KEY must be set (the deploy
# fails otherwise) and DEBUG defaults to false. See CONTRIBUTING.md "Deployment".
# Local dev (ports, DEBUG=true, dev user) lives in docker-compose.override.yml,
# created by scripts/dev-setup.sh from docker-compose.override.example.yml.

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      POSTGRES_USER: ldvelh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (for local dev, run scripts/dev-setup.sh)}
      POSTGRES_DB: ldvelh
      POSTGRES_SERVER_CN: db  # matches the service name used by clients
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (not /data).
      - pgdata:/var/lib/postgresql
      - db-certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldvelh"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ldvelh:${DB_PASSWORD:?DB_PASSWORD must be set (for local dev, run scripts/dev-setup.sh)}@db:5432/ldvelh?sslmode=verify-ca&sslrootcert=/certs/rootCA.crt
      FRONTEND_URL: ${SERVICE_URL_FRONTEND}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set to a Fernet key (for local dev, run scripts/dev-setup.sh)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@yourdomain.com}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to 32+ random characters (for local dev, run scripts/dev-setup.sh)}
      JWT_SESSION_MAX_HOURS: ${JWT_SESSION_MAX_HOURS:-168}
      # Coolify puts one Traefik in front of the backend: its X-Forwarded-For entry is the client.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    volumes:
      - db-certs:/certs:ro

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      network: host
      args:
        # Unset: localhost dev default. Set but empty: same-origin /api (production behind Traefik).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  db-certs:
