# Evaluation-only word lists of the identity corpus code (#151, #152).
# Determiners, elisions, pronouns and apostrophes come from the language pack
# (backend/packs/lang/<language>.yaml); this file holds only what the evaluation adds.
# ANNOTATION.md explains each list.

# The indefinite and demonstrative pronouns of the pack that are never a noun or a
# determiner: every occurrence in a text must be annotated.
unambiguous_pronouns: ["quelqu'un", quiconque, celui-ci, celle-ci, ceux-ci, celles-ci,
  celui-là, celle-là, ceux-là, celles-là]
