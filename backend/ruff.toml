# Lint gate run by CI: `cd backend && ruff check .`
extend-exclude = ["tests"]  # linting tests/ (benchmark included) is tracked in #75

[lint]
# RUF100 makes a stale `# noqa: C901` fail: remove it once its function is at 15 or below.
select = ["C901", "F401", "F841", "RUF100"]

[lint.mccabe]
max-complexity = 15
