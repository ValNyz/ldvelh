# English witness pack (spec §4.12, D35): minimal, it proves the identity code is driven
# by the pack of the game's language. It is not meant for playing in English.

lang: en
version: "1"

articles: [the, a, an]
elisions: []

pronouns:
  personal: [i, you, he, she, it, we, they, him, her, them, us]
  demonstrative: [this, that, these, those]
  indefinite: [someone, somebody, anyone, anybody, everyone, nobody]

stop_words: [the, a, an, of, and, or, at, with, from, by, into]
titles: [mr, mrs, ms, miss, dr, sir, lady, lord, captain, professor]
descriptor_heads: [man, woman, guy, guard, kid, stranger, figure]
reveal_cues: ["my name is", "call me"]
source_cues: [badge, plaque, register, signboard]
negative_answers: ["no"]
plural_markers: [s]
ordinal_markers: ["no.", number]
# Words announcing another entity of a kind already named ("a second key"): an exact
# name right after one is not the entity of that name (the identity prepass leaves it).
other_markers: [second, third, fourth, another]
apostrophes: ["'", "’"]

unknown_character_label: "Unknown person"
unknown_entity_label: "Unknown"
tooltip_labels:
  occupation: "Occupation"
  species: "Species"
  mood: "Mood"
  location_type: "Type"
  sector: "Sector"
  atmosphere: "Atmosphere"
  org_type: "Type"
  domain: "Domain"
  category: "Category"

proper_name_uses_capitals: true
# Letter case tells a name from a common noun (false for a script without case, or a
# language that capitalises every noun): the identity prepass reads a capitalised form as
# a name use; without it, a short form never links alone and is left to the model.
case_marks_names: true
min_distinctive_token_len: 4

prompt_examples:
  identity:
    - input: "\"I'm Rafe Collins,\" says the man in the grey coat."
      output: "ALIAS true_name: the man in the grey coat, present in the scene, introduces himself."
  extraction:
    - input: "Rafe Collins, the knife grinder, sharpens a blade by the fountain."
      output: '{"proposed_entities": [{"entity_type": "character", "label": "Rafe Collins", "kind": "proper_name", "fields": {"occupation": "knife grinder"}}]}'
