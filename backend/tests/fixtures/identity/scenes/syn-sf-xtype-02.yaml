narration: |-
  La file avance au pas sous les néons de la Douane. Au guichet, la douanière aux ongles noirs fait défiler ton dossier sans lever les yeux.

  — Navette immatriculée Mérou, déclare-t-elle. La Douane vous réclame quarante crédits de taxe d'amarrage.

  Quelqu'un éclate de rire derrière toi. Hugo Calder s'accoude au guichet.

  — Quarante crédits pour cette coque rouillée ? Mets-les sur le compte de Calder, ma belle. Le secteur paie pour ses pilotes.

  — Calder, vous êtes interdit de guichet depuis l'incendie, répond la douanière sans s'émouvoir. Reculez.

  *Elle connaît ton ami par son nom*, remarque ton drone. *Et elle n'a pas l'air de l'aimer.*

  Tu paies. En sortant, tu aperçois l'enseigne clignotante du Mérou au bout de la coursive. Le Capitaine te tape sur l'épaule.

  — Je t'offre un verre au Mérou. Pas dans ta navette, dans le vrai.
