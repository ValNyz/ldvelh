history:
- text: |-
    Le Mérou s'est arrimé au Quai 12 avec trois minutes de retard. Tu as à peine coupé les moteurs que le petit drone à ton épaule bourdonne d'impatience.

    *La file de la Douane fait déjà le tour du hall*, annonce-t-il. *Prends ton dossier.*
