narration: |-
  L'appel arrive au milieu du quart de nuit. Capucine le prend sur haut-parleur.

  — Ici Lloyd-Kessel. Nous contestons le contrat de sauvetage.

  La Capitaine coupe le son et se tourne vers toi.

  — Va chercher Clou dans la soute avant. Et notre rescapé aussi. Je veux tout l'équipage ici.

  Dans la soute, le mécano bavard démonte sa propre découpeuse sur un établi. Ta découpeuse pend toujours à ton crochet, intacte.
