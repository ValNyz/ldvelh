narration: |-
  La carcasse gémit à chaque pas. La capitaine aux tresses grises éclaire une coursive tordue.

  — Les armateurs ont abandonné ce vaisseau il y a vingt ans, dit-elle. Ils n'ont jamais payé les familles.

  Le mécano siffle entre ses dents.

  — Et le syndicat va vouloir sa part, comme d'habitude. Sans parler de ces vautours en costume.

  *Signal faible à tribord*, annonce Nox. *Je dirais la boîte noire.*

  Au bout de la coursive, un boîtier orange clignote, sanglé à une cloison. Tu poses ton outil de découpe et tends la main.

  *Et pense à notre vieux rafiot*, ajoute la voix grésillante de ton casque. *Il ne nous attendra pas éternellement.*
