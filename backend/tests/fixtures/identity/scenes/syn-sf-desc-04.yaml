narration: |-
  Le grand hall est plein à craquer. Sur l'estrade, les sept sièges du conseil sont occupés. Au premier rang, la prêtresse voilée égrène un chapelet de cendre.

  *Les dévots du demi-tour sont venus en nombre*, souffle Vesper. *Je compte quarante robes grises.*

  Boussole se penche vers toi.

  — Ils vont demander l'accès à la salle aux vieux registres, murmure-t-elle. Et les gardiens du moteur diront oui, pour avoir la paix.

  Tu serres dans ta poche le petit cadran de cuivre qu'elle t'a confié. Quelque part au-dessus, dans le jardin suspendu, l'homme aux bras couverts de terre attend ton signal.
