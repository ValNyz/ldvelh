narration: |-
  La vieille au capuchon de laine repose son bol et te dévisage longtemps, comme si elle pesait ta question.

  — Maud Ferrandine, finit-elle par dire. Maud, pour ceux qui me versent à boire. J'habitais la maison aux volets clos, en haut de la rue. On l'appelle la Maison des Pendus depuis l'hiver où la Confrérie me l'a prise.

  L'aubergiste à la barbe rousse pose une cruche entre vous deux et s'essuie les mains sur son tablier.

  — Elle dit vrai, grogne-t-il. Les Lanterniers ont cloué les volets eux-mêmes. Depuis, cette maison porte malheur à toute la rue.

  Le feu de l'auberge baisse. Ta lanterne de corne grésille sur la table, et Maud Ferrandine tend ses doigts vers la flamme.

  *Elle a bu deux cruches et elle se souvient de tout*, chuchote Noctule dans ton col.
