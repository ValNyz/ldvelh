narration: |-
  Rizka a les deux bras plongés dans le coupleur quand la porte de l'atelier coulisse. Une femme en blouse blanche entre, une mallette de soins à la main, et s'arrête devant l'établi.

  — Elara Voss, dit-elle en tendant la main à la mécanicienne. Médecin de bord, affectée depuis hier par le Conseil de bord.

  Rizka Voss regarde la main tendue, puis ses propres doigts noirs de graisse.

  — Le même nom que moi ? On va bien s'amuser avec les fiches de paie.

  La nouvelle venue sourit à peine.

  — Je ne vous connais pas, et je viens de l'autre bout du système. Le nom est courant, là-bas. Je cherche l'infirmerie du pont inférieur : on m'a dit de passer par ici.

  *Elle n'est dans aucun de tes fichiers*, souffle Brume. *Deux personnes, un seul nom.*
