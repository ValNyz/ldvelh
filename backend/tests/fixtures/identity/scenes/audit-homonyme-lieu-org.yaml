narration: |-
  Tu pousses la porte de la Capitainerie du Port-Sec un peu avant l'ouverture. Le hall sent le métal chaud et le café brûlé. Vigie bourdonne au-dessus de ton épaule et projette le plan des docks du Port-Sec sur le mur.

  Talia Benhamou t'attend derrière le guichet, un tampon à la main.

  — La Capitainerie a refusé ton permis, dit-elle. Pas moi : la Capitainerie du Port-Sec, en tant qu'autorité portuaire. Moi, je tamponne.

  — Et la Vigie ?

  — La milice du port a demandé ton dossier hier soir, soupire l'officière. Elle veut savoir pourquoi ton drone survole les docks la nuit.

  Tu ressors dans la rue. Vue d'en face, la Capitainerie ressemble à un bunker posé sur des pilotis.

  *Vigie a filmé son badge*, note la voix dans ton oreillette. *Si Talia ment, on le saura.*
