narration: |-
  Rizka Voss referme le capot du coupleur ionique et s'essuie les mains sur son bleu de travail.

  — Voss est passée ce matin, dit-elle. Pas moi : l'autre, celle de l'infirmerie. Elle voulait savoir si le Conseil de bord t'avait déjà convoqué.

  Un apprenti passe la tête par la porte de l'atelier.

  — Voss, le coupleur, il est prêt ?

  La mécanicienne aux avant-bras tatoués lève le pouce sans se retourner.

  — Tu vois le problème, reprend Rizka. Deux Voss sur le même pont. Elara et moi, on n'est même pas cousines. Mais le Conseil nous range dans le même dossier depuis un mois.

  *La médecin aux gants bleus t'attend à l'infirmerie avant la relève*, précise Brume.
