narration: |-
  Le messager boiteux te tend un pli cacheté de cire verte.

  — De la part de Sœur Ambroisine. Elle dit que le reliquaire n'est plus en sécurité à l'abbaye.

  Tu revois la nonne aux mains brûlées, huit jours plus tôt, au pied des remparts de l'Abbaye de Morteval, quand elle avait soulevé pour toi le couvercle du Reliquaire d'étain.

  — L'Ordre la surveille, ajoute le messager. Les Veilleurs ont doublé la garde aux portes.

  Le pli n'est signé que d'une initiale, à la manière d'Ambroisine : un A barré. L'Ordre des Veilleurs n'en saura rien, si tu le brûles.

  *Le pont n'est pas plus sûr que l'abbaye*, couine Noctule.
