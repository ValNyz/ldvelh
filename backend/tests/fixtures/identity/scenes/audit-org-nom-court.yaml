narration: |-
  L'intendant Mastin étale les registres de la Compagnie sur le comptoir et chausse ses lunettes.

  — Tout ce qui entre aux Hautes-Brumes passe par la Compagnie Marchande, dit-il. Ça vaut pour ta lettre de change comme pour le sel.

  Il retourne la lettre et fronce les sourcils devant le cachet de cire noire.

  — Elle n'est pas de chez nous. Ce sceau-là, c'est celui de la Maison Valdrake. Avec Valdrake, la Compagnie ne traite plus depuis trois saisons.

  Les commanditaires au sceau noir dont parlaient les rumeurs ont donc un nom. Aurèle Mastin referme le grand livre de la maison de commerce.

  — Et ne compte pas sur la Compagnie du Guet : elle escorte nos convois, mais elle ne signe rien en notre nom. Demande plutôt à la Compagnie Marchande des Hautes-Brumes de racheter ta créance, si elle en veut encore.

  *Ton papier ne vaut rien ici*, siffle Noctule. *Je te l'avais dit au comptoir d'en bas.*
