narration: |-
  La grosse femme au tablier taché t'entraîne derrière un étal, loin des oreilles.

  — Le Corbeau cherche le registre, souffle-t-elle. Celui que tu as pris à l'officier. Et la Guilde veut récupérer la carte des hauts-fonds.

  — Et les Compagnons ?

  — Eux, c'est l'Œil qu'ils veulent. Cache-le.

  Tu glisses la médaille sous ta chemise, à côté de ton couteau de marin. Les Écailles se vident peu à peu ; les marchandes rentrent leurs paniers.

  — Ne reviens pas chez Gravel avant trois jours, ajoute-t-elle. Ils surveillent la maison. Et l'office du port voudrait bien te voir pendue.

  *Et ta longue-vue*, rappelle Grimaud. *Range-la. Elle brille comme un aveu.*
