narration: |-
  Le capitaine Delmas s'adosse à la rambarde du Quai 6 et allume une cigarette.

  — La Guilde des Pilotes ne paiera pas, dit-il. Mais la Guilde des Convoyeurs, elle, vient d'envoyer une offre. Ils recrutent au Quai 9, pas ici.

  Il sort de sa poche une seconde clé et te la tend.

  — La clé de la soute B. Garde-la avec ta clé de la soute A, et ne les mélange pas. Rendez-vous ce soir au Bar de l'Hélice, sur le Quai 9. Demande Basile Krantz, le recruteur des Convoyeurs.

  Orso écrase sa cigarette.

  — Et ne dis rien à la Guilde. Ils me retireraient ma licence pour moins que ça.

  *Deux guildes, deux quais, deux clés*, résume Sillage. *Le capitaine aime compliquer les choses.*
