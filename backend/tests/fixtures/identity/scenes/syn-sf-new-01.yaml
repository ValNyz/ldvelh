narration: |-
  Au vestiaire du Puits 4, Saskia parle à voix basse avec un grand type en combinaison grise, un brassard de contremaître au bras, le même que le sien.

  — Jonas, voici Brecht, qui tient l'équipe de nuit, dit-elle. Ce soir, vous descendez tous les deux au Puits 6.

  Brecht te tend un badge rouge, encore tiède de l'imprimante.

  — Avec ton badge jaune, tu n'ouvres que les galeries hautes. Celui-ci ouvre tout le Puits 6. Tu me le rends demain.

  — Et pas un mot à la Forge, ajoute la contremaîtresse. Les Fondeurs Unis de l'Anneau C leur ont déjà proposé de briser la grève ; ils n'attendent qu'une excuse.

  *Un badge qui ouvre tout*, note ton IA. *Garde-le loin de ta foreuse, le champ magnétique l'efface.*
