history:
- text: |-
    Saskia t'a fait descendre au vestiaire avant la relève. Les autres sont déjà partis ; il ne reste que l'odeur de graisse et son casque rayé accroché à une patère.

    *Elle veut te parler seule*, observe Mire. *Ou presque seule.*
