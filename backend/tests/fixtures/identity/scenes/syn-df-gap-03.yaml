history:
- text: |-
    Le réfectoire de l'Abbaye de Saël est presque vide ce soir. Ide partage avec toi un quignon de pain noir.

    *Les frères mangent dans leurs cellules, maintenant*, note Isaure. *Ils ont peur les uns des autres.*
  mentions:
  - surface: l'Abbaye de Saël
    start: 17
    category: EASY
    expected: MATCH location_abbaye_de_sael
  - surface: Ide
    start: 60
    category: PART
    expected: MATCH character_ide_ferraud
  - surface: Isaure
    start: 166
    category: PC
    expected: MATCH companion_isaure
- text: |-
    Odon Lebrac entre en soufflant, le trousseau battant contre sa bedaine, et s'assied lourdement à votre table.

    — J'en reviens, dit-il. Et ce n'est pas beau.
  mentions:
  - surface: Odon Lebrac
    start: 0
    category: EASY
    expected: MATCH character_odon_lebrac
