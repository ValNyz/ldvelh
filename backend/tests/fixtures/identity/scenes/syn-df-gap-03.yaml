narration: |-
  Le cellérier baisse la voix.

  — L'Inquisiteur est revenu. Avec lui, toute la Compagnie, et la Lanterne brûle jour et nuit dans la nef. Ils ont fait sceller le Scriptorium et brûler ce qu'il y avait sur les pupitres.

  Il se signe.

  — Et la Phalange de Sainte Brune a reparu. À l'hospice, dans le lit d'un lépreux mort. Corlay dit que c'est un signe de la Flamme Pâle.

  Ide pâlit et pose la main sur sa poche, là où elle cache Passe-Tombe.

  *S'ils fouillent les novices, ils la trouveront*, murmure Isaure.
