narration: |-
  Le message tombe pendant ton quart de sommeil : la Guilde des Pilotes te convoque.

  Tu fouilles ton casier à la recherche de ta licence, et tu la trouves sous ton pistolet à aiguilles, déchargé depuis des jours.

  *La dernière fois qu'ils t'ont convoqué, c'était pour le colis 88-Tango*, rappelle Oko. *Et la clinique n'avait pas apprécié.*

  Au bout du Quai 12, la pilote balafrée t'attend, adossée à une borne.

  — La Pie te salue, dit-elle avec un sourire de travers. Ça fait combien, une semaine ?
