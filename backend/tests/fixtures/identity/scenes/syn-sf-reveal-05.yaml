narration: |-
  Devant la porte aux symboles effacés, deux porteurs de cendres montent la garde, le visage barbouillé de gris. L'enfant aux cheveux ras gratte le métal du bout de l'ongle. Sous la crasse, des lettres réapparaissent : « Archives du Départ ».

  — Je m'appelle Tilio, chuchote-t-il, comme si c'était le plus grand secret de la soirée. Tilio Marchetti. Et eux, c'est la Fraternité du Retour. Ils disent que le vaisseau doit faire demi-tour.

  Derrière les gardes, sur une console, repose un coffret de bois noir fermé par un cadenas de cuivre. Sur le couvercle, gravé à la main : « Coffret des Fondateurs ».

  *Une porte, un enfant et une secte*, résume Vesper. *Elio, on rentre avant le couvre-feu.*
