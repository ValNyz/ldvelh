narration: |-
  Dans la pénombre de la chambre, la Comtesse n'est pas seule. Une seconde femme au voile d'argent se tient près de l'âtre, plus petite, plus voûtée, et c'est à elle qu'Ysolde s'adresse d'abord.

  — Voici celle dont je vous ai parlé.

  Elle ne relève pas son voile, mais te tend un médaillon de jais, encore chaud de sa paume.

  — Portez-le au Gué-aux-Morts avant l'aube, dit-elle. Ceux de la Ligue des Veuves vous y attendront.

  La Comtesse pose ensuite sur la table, à côté de ton sceau, un second sceau aux armes d'Orgemont.

  — Volé dans la Tour d'Ombre il y a vingt ans. Avec lui, vous passerez leurs barrages.

  *Deux sceaux, deux maisons, deux voiles*, souffle Brume. *Et une seule de ces femmes me plaît.*
