narration: |-
  Les lampions de la rue des Lampions grésillent sous la pluie de condensation. Carmen marche devant toi, parapluie ouvert.

  — On coupe par la cour, dit-elle. Puis le puits jusqu'au quartier bas. Les Antennistes nous attendent en bas de Sainte-Clotilde.

  *La Brigade patrouille sur les Lampions toutes les dix minutes*, prévient Grain.

  Tu vérifies le sérum dans ta poche intérieure, puis la bande, enveloppée dans un chiffon.
