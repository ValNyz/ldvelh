narration: |-
  Le docker à la cicatrice fait rouler la caisse scellée depuis le quai marchand jusqu'à la porte du bâtiment sans enseigne. Sous la poussière, une plaque rivetée apparaît sur le flanc : Conteneur 112-B.

  — Faut pas traîner ici, dit-il en s'essuyant le front. Moi, c'est Ilan Varek, si on te demande qui t'a aidé.

  Au-dessus de la porte, une enseigne repeinte à la hâte laisse encore deviner deux mots : Entrepôt Kessler. Ilan glisse le bordereau d'expédition sous la sangle et tapote la case du destinataire.

  — Consortium Ardent. Tu voulais savoir qui étaient les acheteurs anonymes ? Voilà. Et le Consortium paie à la livraison, pas avant.

  Il pousse le conteneur à l'intérieur de l'entrepôt et rabat la bâche.

  *Consortium Ardent : aucune trace dans les registres publics*, note Sillage. *Le docker, lui, figure sur la liste de paie du quai.*
