narration: |-
  Le hall de la Guilde sent le kérosène froid. Hugo discute avec la douanière aux ongles noirs, qui a troqué son uniforme contre une veste civile.

  — Je te présente Wen Albescu, dit le Capitaine. Elle a quitté la douane ce matin.

  — Albescu suffit, corrige-t-elle. Et j'ai démissionné, nuance. Ils voulaient que j'oublie ton colis et l'entrepôt.

  *Elle parle du quai douze aussi ?* demande Oko dans ton oreillette.

  Hugo pose devant toi un formulaire de la Guilde et ta licence de pilote, tamponnée.

  — Signe. Avec la Sérénade sur le dos, mieux vaut être inscrit quelque part.
