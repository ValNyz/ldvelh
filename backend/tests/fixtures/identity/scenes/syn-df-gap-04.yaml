history:
- text: |-
    Le brouillard s'est levé sur Port-Cendre. Ilse Ferrand t'attend au bout d'une jetée, assise sur une bitte d'amarrage, les bras croisés sur ses tatouages.

    *Elle a l'air de quelqu'un qui apporte une mauvaise nouvelle*, note Grimaud. *Ou de quelqu'un qui en est une.*
