narration: |-
  La rousse crache dans l'eau grise.

  — La Douane a saisi le Lot de Sombrelune cette nuit. Les Compagnons ont pris le large sans tirer un coup de feu. Et Lamothe a disparu : on a retrouvé sa jambe de bois au pied du Phare de la Veuve.

  Elle te regarde enfin.

  — Tu as encore ta carte ? Sans elle, personne ne passera les hauts-fonds avant l'hiver. Garde aussi ton couteau à portée de main.

  *Et ta longue-vue*, ajoute Grimaud. *On voit venir les ennuis de loin, avec.*
