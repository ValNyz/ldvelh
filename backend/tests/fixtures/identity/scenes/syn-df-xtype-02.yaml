narration: |-
  Les tours de Vauclair se dressent au-dessus du ravin, noires contre le ciel de cendre. Sous la herse, Vasseur t'attend, les mains croisées dans le dos.

  — Vauclair honore ses dettes, dit-il. Montrez-moi le sceau. La famille n'aime pas les imposteurs.

  Tu le tires de ton gant. Il y jette à peine un œil.

  — Vauclair vous recevra elle-même, ce soir. D'ici là, ne vous approchez pas des chariots.

  Dans la cour, des hommes déchargent un minerai noir et luisant, monté de Cœur de Morne à dos de mule.

  — Et le Cœur de Morne ? demandes-tu.

  — Dans les appartements de la Comtesse, sous trois serrures. Personne ne le voit.

  *Une mine et une pierre qui portent le même nom*, note la chouette sur ton épaule. *Et une femme, une maison et un château. Ici, on hérite même des noms.*
