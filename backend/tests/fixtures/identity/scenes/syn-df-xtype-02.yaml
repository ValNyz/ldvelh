history:
- text: |-
    La route de Morne monte entre des sapins noirs. Sur ton épaule, Brume ébouriffe ses plumes.

    *Des fumées, là-haut. La mine ne dort jamais.*

    Au loin, les cheminées de Cœur de Morne crachent une fumée grise qui se couche sur la vallée.
