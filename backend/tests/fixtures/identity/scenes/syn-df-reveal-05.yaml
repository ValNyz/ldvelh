history:
- text: |-
    Les cloches de l'Abbaye de Saël ont sonné complies depuis longtemps. Dans le Cloître des Novices, la novice au visage brûlé balaie des feuilles mortes qui n'existent pas.

    *Elle t'attendait*, murmure Isaure. *Elle fait semblant depuis une heure.*
