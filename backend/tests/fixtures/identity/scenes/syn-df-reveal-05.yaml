narration: |-
  La novice appuie son balai contre une colonne et vérifie que le cloître est vide.

  — Le Prieur dort, chuchote-t-elle. Vous vouliez savoir où vont les filles qui disparaissent. Moi, c'est Ide. Ide Ferraud. J'étais la quatrième sur la liste.

  Elle te mène jusqu'à une porte basse derrière l'autel, et de là dans la crypte sous le chœur. L'air y est sec, saturé d'encens froid. Au-dessus des niches, une frise gravée court le long de la voûte : Caveau des Abbesses.

  — Les abbesses dorment là depuis quatre siècles, dit Ide. Les novices, depuis l'hiver.

  Au fond, une niche a été fraîchement maçonnée.

  *Il y a quelqu'un derrière ce mur*, souffle le fantôme pâle à tes côtés. *Quelqu'un qui respire encore.*
