narration: |-
  Le message arrive à l'aube, sans signature : « La cour, à midi. » Tu reconnais l'écriture penchée de Carmen Lisowski.

  *La Régie a coupé l'air du Quartier Bas cette nuit*, rapporte Grain. *Trois immeubles. Ils parlent d'une fuite.*

  À midi, la Rouge t'attend sous son parapluie. Elle tend la main.

  — La Bande Delta. Les Antennistes ont enfin trouvé un lecteur.
