narration: |-
  La femme au voile d'argent entre sans bruit. Le voile ne laisse voir que sa bouche, mince et pâle.

  — Vous êtes venue pour la chapelle, dit la Comtesse. Mon père l'a laissée tomber en ruine ; je n'ai pas de quoi la relever. Vasseur, conduisez-la.

  L'intendant s'incline sans un mot. Il te mène à travers une cour envahie de ronces jusqu'à la chapelle effondrée, dont le toit s'est ouvert comme une coque de noix. Au-dessus du portail, des lettres à demi effacées : Oratoire Saint-Aubin.

  — Thibault Vasseur, dit-il soudain, comme s'il avait oublié de se présenter. Pour vous servir, tant que la Maison me paie.

  *Il a attendu d'être seul avec toi pour donner son prénom*, remarque Brume. *Retiens-le.*
