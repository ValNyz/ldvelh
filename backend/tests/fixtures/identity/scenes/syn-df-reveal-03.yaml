history:
- text: |-
    Le Château Vauclair n'a plus de château que le nom : la moitié des salles sont closes, les tapisseries mangées de salpêtre. L'intendant au crâne rasé te fait patienter dans une galerie glacée.

    *Il compte tes pas*, souffle Brume.
