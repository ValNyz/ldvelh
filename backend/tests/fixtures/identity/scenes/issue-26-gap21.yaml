narration: |-
  Le message s'affiche sur ton terminal au moment où la dernière caisse touche le sol : « Voss t'attend au labo. Apporte l'échantillon. »

  Corin lit par-dessus ton épaule et ricane.

  — Pas moi, en tout cas. Voss, sur cette jetée, c'est moi, et je n'ai pas de labo. L'autre, c'est la toubib du troisième niveau, celle qui travaille pour l'Institut.

  Tu te souviens d'elle, même si dix-huit tours de garde ont passé : Dr. Elara Voss, ses gants bleus, sa façon de compter les secondes. C'est elle qui t'avait confié le flacon scellé au nom de l'Institut Ferrand, avant de redescendre au Laboratoire de biologie.

  *Le flacon est toujours dans ta sacoche*, dit la voix de ton bracelet. *Corin Voss a fini sa journée, toi non.*
