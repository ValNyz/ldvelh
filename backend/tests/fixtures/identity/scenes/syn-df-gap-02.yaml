narration: |-
  La Comtesse attend que la porte de la forge soit refermée.

  — Le Baron est rentré d'exil, dit-elle. Il a rouvert la Tour d'Ombre et racheté le contrat des Lames Grises. Les Orgemont n'ont jamais su perdre.

  Elle fait glisser vers toi un billet plié en quatre.

  — Ce n'est pas tout. Vasseur a disparu la nuit dernière, et le coffret de plomb avec lui. On a retrouvé sa lanterne dans l'oratoire.

  Tu poses la main sur ton épée, par réflexe.

  *Gaspard d'Orgemont ne rentre jamais sans une bonne raison de tuer quelqu'un*, souffle Brume.
