narration: |-
  Sous l'arche d'un pont, Jorin s'arrête enfin et reprend son souffle.

  — Le Prévôt te cherche, dit-il. Pas ses sergents, lui. Il t'attend ce soir au Croc, dans la salle du fond. Il veut que tu lui racontes ce que tu as vu dans la Venelle des Saigneurs.

  Il crache dans l'eau noire.

  — Et il y a pire. Le Couperet a disparu de sa grille. La Doyenne a fait fouiller toute la Halle, jusqu'aux fosses à suif. La Garde prévôtale n'a même pas été prévenue : la corporation lave son linge en famille.

  *Hugues de Brasquet ne se déplace jamais pour un vol*, murmure Vespérine. *Il se déplace pour un cadavre. Et la taverne n'a qu'une sortie.*
