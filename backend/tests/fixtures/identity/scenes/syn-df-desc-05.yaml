narration: |-
  Le cellérier se verse un fond de cidre et le boit d'un trait.

  — Donc le saint homme vit sous nos pieds avec son grimoire, dit-il. Et l'ordre de ses gardiens n'a plus qu'un membre. La confrérie grise rôde autour du mouroir toutes les nuits, et l'Inquisition attend qu'on lui donne un prétexte pour brûler le couvent à la flamme de la Lanterne.

  Il repose sa timbale.

  — Et notre supérieur dort sur ses deux oreilles.

  *Il a dit « notre » comme on crache*, note Isaure.
