history:
- text: |-
    Tu as tout raconté à Odon Lebrac, dans le cellier, entre deux tonneaux de cidre aigre. Il t'a écouté jusqu'au bout sans t'interrompre, ce qui ne lui ressemble pas.

    *Il te croit*, dit Isaure. *C'est presque pire.*
