narration: |-
  L'officier au chapeau à plume jette son gant sur la table.

  — Le fisc du roi réclame le chargement maudit, dit-il. L'office du port aussi. Et moi, je veux savoir pourquoi l'équipage du borgne vous paie à boire à la gargote tous les soirs.

  Il se penche.

  — La confrérie des barreurs refuse de me répondre. L'équipage au pavillon noir a quitté la rade. Au fanal, on jure n'avoir rien vu. Il ne me reste que vous.

  Tu sens contre ta hanche ta lame, qu'on a oublié de te prendre.

  *Ne mens pas trop bien*, conseille Grimaud. *Les honnêtes gens mentent mal.*
