history:
- text: |-
    On t'a fait asseoir sur un banc de bois dans le bureau de Renaud Esquer. Par la fenêtre, on voit les quais et les potences.

    *Il t'a laissée attendre une heure*, note Grimaud. *Il veut que tu aies peur avant qu'il entre.*
