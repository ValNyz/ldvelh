    expected: SKIP
- text: |-
    Tu prends l'escalier sans fin pour éviter les manteaux verts qui filtrent l'ascenseur.

    *Quatre cents marches*, compte le murmure dans ton gant. *Tu n'en as fait que quatre-vingts.*
  mentions:
