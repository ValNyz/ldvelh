narration: |-
  À mi-hauteur de l'escalier sans fin, une plaque d'émail à moitié arrachée indique encore : « Puits Sainte-Clotilde, palier 9 ».

  Au palier suivant, deux silhouettes en manteau vert te barrent le passage. Un insigne holographique s'allume devant ton visage : « Brigade Salubrité, contrôle sanitaire ».

  — Produits médicaux non déclarés ? demande une agente à la capuche baissée.

  Tu sens la fiole bleue peser dans ta poche. Sur son étiquette, que tu n'avais pas lue, il est écrit en petites lettres : « Sérum Azur-3 ».

  *La Brigade ne fouille que ceux qui transpirent*, chuchote Grain. *Respire, Lou.*

  — Rien à déclarer, dis-tu. Je vais voir Mireille à la Ruche.
