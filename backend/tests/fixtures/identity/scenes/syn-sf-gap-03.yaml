narration: |-
  Ariane te secoue à quatre heures, la voix blanche.

  — Le lac a bougé. Les sismographes s'affolent depuis minuit.

  Tu attrapes ton carnet de relevés et tu cours vers le Sas Nord. Derrière la vitre, les projecteurs éclairent une eau qui bouillonne.

  — La Compagnie Borée a rappelé, ajoute-t-elle en courant. Ils veulent leur échantillon avant la fin de la semaine. Celui que tu as rapporté de la galerie.

  *Ils ne l'auront pas*, murmure Sel. *Je l'ai rangé au frais, là où personne ne cherche.*
