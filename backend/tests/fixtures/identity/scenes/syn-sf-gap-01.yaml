history:
- text: |-
    Saskia hurle des ordres dans la poussière. Une poutre a cédé au fond du Puits 4 et les foreurs reculent en toussant.

    *Sors de là*, répète Mire. *Tout de suite.*
  mentions:
  - surface: Saskia
    start: 0
    category: PART
    expected: MATCH character_saskia_lindqvist
  - surface: Puits 4
    start: 72
    category: EASY
    expected: MATCH location_puits_4
  - surface: les foreurs
    start: 83
    category: SKIP
    expected: SKIP
  - surface: Mire
    start: 139
    category: PC
    expected: MATCH companion_mire
- text: Tu rampes sous la poutre. Quelque chose t'entaille la jambe. Derrière toi, la contremaîtresse au casque rayé compte ses hommes à voix haute, puis recommence.
  mentions:
