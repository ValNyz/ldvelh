narration: |-
  La sirène du Puits 4 se tait enfin. Tu remontes la galerie en boitant, ta jambe gauche trempée jusqu'à la botte.

  *Il te faut un médecin*, dit Mire. *La Docteure te connaît. Elle t'a recousu le premier jour.*

  À l'entrée de l'Infirmerie, le lecteur refuse ta main, puis accepte ton badge jaune. Derrière la vitre, la médecin aux lunettes fendues lève la tête de son écran.

  — Encore toi, soupire Ines Ferrand. La Compagnie ne paie plus les points de suture, tu sais. Et Amaru dit que tu as toujours une ardoise au Comptoir.
