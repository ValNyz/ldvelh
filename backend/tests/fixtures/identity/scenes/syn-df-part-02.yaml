narration: |-
  Gaspard te fait asseoir près d'un feu maigre.

  — La Comtesse vous envoie avec son sceau et sans escorte. Ysolde a toujours aimé les beaux gestes.

  Tu poses le sceau sur la table, entre vous deux.

  — Le château vous offre la paix, dis-tu.

  — Les Orgemont ne signent pas de paix, répond le Baron. Ils achètent des trêves. Les Lames m'ont coûté assez cher pour que je m'en serve.

  La Tour craque sous le vent. Il jette un regard à ton épée.

  — L'épée de Haldric, dit-il. Je l'ai vue à l'œuvre, jadis.

  *Il ment*, chuchote Brume. *Il ne l'a jamais vue que de loin.*
