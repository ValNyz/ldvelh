history:
- text: |-
    La Tour d'Ombre se dresse seule au milieu des marais, noire et sans fenêtre au premier étage. Gaspard d'Orgemont te reçoit tout en haut, après quatre cents marches.

    *Il fait monter les marches à ceux qu'il veut épuiser*, note Brume.
