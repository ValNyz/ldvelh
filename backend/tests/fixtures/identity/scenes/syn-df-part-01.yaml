history:
- text: |-
    La nuit est tombée sur la Venelle des Saigneurs. Jorin Saulce porte une lanterne sourde qu'il masque de sa main à chaque bruit.

    — Si le Boucher de Vargne passe par ici, on le verra avant qu'il nous voie.

    *Ou l'inverse*, souffle Vespérine.
