narration: |-
  Un chat file entre tes jambes. Jorin sursaute si fort que la lanterne cogne le mur.

  — Pardon, chuchote-t-il. Depuis que le Boucher a frappé chez nous, je dors plus. Brasquet peut bien promettre ce qu'il veut au Croc, la Garde ne descend jamais jusqu'ici.

  Au fond de la venelle, quelque chose remue près d'un baquet. Un chien, peut-être.

  — Si c'est lui, souffle-t-il, il a peut-être le couperet du saint. Ancelise dit que sans la relique, la Guilde n'a plus le droit d'abattre.

  Tu fermes la main sur ta chevalière. L'onyx est glacé.

  *Ce n'est pas lui*, dit l'esprit de ta bague. *Lui, il ne fait jamais de bruit.*
