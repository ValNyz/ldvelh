narration: |-
  Les hommes en combinaison blanche repartent enfin. Tu t'approches du colis emballé de mousse. Un tampon violet barre le film plastique : « Colis 88-Tango, destinataire Clinique Sérénade ». Le même logo, une fleur blanche, était cousu sur leurs manches.

  *La Clinique Sérénade*, lit Oko. *Une clinique qui reçoit ses colis dans une chambre froide.*

  Au-dessus de la porte, une plaque rouillée porte encore l'ancien nom de la salle : « Entrepôt Frigorifique Sept ».

  — Pas un geste, dit la douanière aux ongles noirs, debout dans l'encadrement.
