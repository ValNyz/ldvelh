narration: |-
  Le gros moine au trousseau ouvre une porte après l'autre.

  — Ici, le cloître des novices. Là-bas, l'hospice. Et derrière ce mur, le scriptorium : la Compagnie y a posé ses scellés. Depuis que l'Inquisition est là, plus personne n'y copie une ligne.

  Vous descendez quelques marches vers le caveau, puis remontez aussitôt : la grille est fermée. Du haut du clocher, toute l'abbaye de Saël s'étale sous la pluie.

  — Le Culte n'a jamais mis les pieds ici, affirme-t-il trop vite. La Flamme Pâle, c'est une histoire pour les veillées. Ce qui compte, c'est la Phalange, et elle est bien gardée.

  *Bien gardée*, ricane Isaure. *Il en a la clé à sa ceinture.*
