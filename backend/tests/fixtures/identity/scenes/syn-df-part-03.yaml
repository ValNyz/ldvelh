history:
- text: |-
    Odon Lebrac t'a promis la visite complète, à condition que tu portes le panier de navets. Il marche devant, le trousseau à la ceinture, en saluant chaque pierre.

    *Il parle beaucoup pour un homme qui a peur*, observe Isaure.
