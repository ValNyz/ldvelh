narration: |-
  *Correspondance dans quatorze minutes*, annonce la voix de la borne. *Je te suis sur ton terminal, ne t'inquiète pas.*

  Le gardien de nuit lève les yeux de son journal.

  — Tu parles à l'IA de la Régie ? Elle ne répond jamais à personne, d'habitude.

  — Lumen, réponds-tu. Elle s'appelle Lumen, et elle me répond, à moi.

  Le vieil homme en uniforme hausse les épaules et fait glisser un jeton de transit sur le comptoir.

  — Pour le quai 12. Le dernier train de la Régie des Transports ne t'attendra pas, avec ou sans ta copine électronique.

  Tu empoches le jeton et traverses le hall de la Gare de transit Nord.

  *Ta copine électronique te remercie*, dit Lumen sur ton terminal de poche. *Le gardien a raison pour une chose : il reste neuf minutes.*
