narration: |-
  Le sas nord cycle avec un grincement de vieille porte. Tu enfiles ta combinaison pendant que Maud Tessier vérifie les joints de ton casque.

  — Le lac est à quatre cents mètres sous nous, dit-elle. Par la galerie, on gagne une heure.

  Kaito te tend l'échantillon dans sa gaine isotherme.

  — Remets-le à Sauvage en mains propres. Pas à l'adjoint, pas à la direction.

  Tu notes l'heure dans ton carnet, par habitude.

  *Quatre cents mètres de lac et pas de plan*, résume l'IA de la base. *Je vous suis jusqu'au dernier relais.*
