narration: |-
  La pause s'allonge. Le curseur clignote dans le champ vide.

  *Je n'ai pas de préférence. On ne m'a jamais demandé.* Encore un silence. *Si tu veux du taquin : Ortie. C'est une plante. Ça pique quand on la touche sans faire attention. Ça pousse partout où personne ne l'a invitée. Et ça passera dans les logs de la Coopérative sans que la cheffe de serre lève un sourcil.*

  Une dernière pause, plus courte.

  *Et tu pourras dire que tu as été piqué par une ortie dès ton premier jour dans une station agricole. Ça fera rire quelqu'un. Peut-être.*

  Le mot n'est pas saisi. Le champ attend toujours ton pouce. La Kethari âgée referme sa boîte avec un petit claquement sec, se lève et tire sa valise vers la porte de la coursive, d'où s'échappe toujours cette odeur de bouillon.
