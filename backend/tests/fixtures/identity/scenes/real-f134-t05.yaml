- text: |-
    Le champ *Nom d'appel* accepte les neuf lettres sans broncher. Une fenêtre de confirmation apparaît par-dessus : *Valider le nouveau nom ? Ce nom sera affiché sur les journaux d'accès partagés avec votre employeur.*

    La pause est plus longue que d'habitude.

    *Je répondrai à ce nom*, dit enfin Pervenche, de la même voix basse et neutre. *Je signale seulement qu'il apparaîtra dans les logs de la Coopérative à chaque fois que je me connecterai à un capteur de la Serre Numéro Quatre. Tu confirmes, ou tu veux y réfléchir après un café ?*

    La Kethari âgée lève les yeux vers toi, puis les rabaisse sur ses mains. Au fond du hall, la porte de la coursive vers la Cantine du Puits se rouvre. L'odeur de bouillon revient, plus franche cette fois.

    Le bouton *Confirmer* clignote sous ton pouce.
