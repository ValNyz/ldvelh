history:
- text: |-
    Le sas se referme derrière toi avec un chuintement las. Le Hall d'Arrivée Quai Sud est une longue boîte de métal gris. La moitié des plafonniers sont éteints, les autres grésillent. Une condensation fine perle sur les rambardes. L'air sent le terreau mouillé, l'huile de joint et quelque chose de vaguement sucré, comme des légumes laissés trop longtemps dans un bac.

    Les autres passagers de la navette se dispersent sans un regard. Un homme en combinaison de cargo s'éloigne déjà vers une coursive latérale. Deux adolescentes se disputent à voix basse au-dessus d'un sac éventré. Une Kethari âgée attend, immobile, que quelqu'un vienne la chercher. Personne ne vient.

    Contre le mur, une borne d'accueil affiche en lettres orange : *SERVICE INDISPONIBLE — MIGRATION EN COURS. Merci de vous adresser au Bureau des Résidences (ouverture 08h00).* À côté, une affichette plastifiée se décolle par un coin : *AUDIT SANITAIRE INTERSYSTÈME — J-20. Toutes les unités de production doivent tenir leurs relevés à jour.* Quelqu'un a griffonné dessous au marqueur : « *lesquels ?* »

    Ton terminal personnel vibre contre ta hanche. Deux notifications de la Coopérative Agronomique d'Ombelle, arrivées pendant le transit. La première t'indique ton logement : *Chambre 3-17, Anneau Résidentiel — validation requise au Bureau des Résidences*. La seconde t'attend pour ta prise de poste : *Serre Numéro Quatre, 08h00, demander la cheffe de serre*. Aucune des deux ne précise comment s'y rendre.

    Un panneau de direction à moitié rouillé pointe trois flèches : *Résidences*, *Serres 1-6*, *Cantine du Puits*. Sous la troisième, un pictogramme de bol fumant, et l'horaire : *ouvert dès 05h30*.

    *Il est cinq heures quarante-sept*, dit Pervenche, après une pause un peu trop longue. *Tu as deux heures et treize minutes avant ta prise de poste.*

    La Kethari âgée s'est assise sur sa valise. Au-dessus de toi, un plafonnier clignote encore, puis s'éteint.
