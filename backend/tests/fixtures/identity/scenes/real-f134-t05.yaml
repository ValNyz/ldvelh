    *Cinq lettres. C'est plus rapide à prononcer*, dit Pervenche, après une pause qui s'étire. *Les logs de la Coopérative n'en tiendront pas compte. La cheffe de serre, peut-être.*

    Un silence, puis :

    *Pervenche est toujours disponible. Elle ne demande rien.*

    La Kethari âgée a sorti une boîte de sa poche et grignote quelque chose de sec, méthodiquement, sans te regarder. Au fond du hall, la porte de la coursive se referme sur un rire étouffé et un tintement de vaisselle. Le panneau rouillé affiche toujours ses trois flèches.
