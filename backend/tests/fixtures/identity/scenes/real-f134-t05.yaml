- text: |-
    Le silence dure. Assez longtemps pour que la Kethari âgée change de position sur sa valise.

    *C'est possible*, dit enfin Pervenche. *Il faut modifier le champ d'identification dans mes paramètres. Je répondrai au nouveau nom. Il me faudra peut-être quelques jours pour ne plus répondre à l'ancien.*

    Une autre pause.

    *Tu as un nom en tête, ou c'est une idée de cinq heures quarante-neuf ?*

    Sur ton terminal, l'écran de configuration s'est ouvert de lui-même. Le champ *Nom d'appel* clignote, vide, à côté de « Pervenche » grisé.

    Au bout du hall, quelqu'un a déjà poussé la porte de la coursive vers la Cantine du Puits. Une odeur de bouillon chaud arrive jusqu'à toi, puis se dissipe.
