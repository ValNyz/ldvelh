narration: |-
  La cour aux pigeons est déserte, à part l'inconnue au parapluie rouge et une volée d'oiseaux gris. Sur le mur, au-dessus d'une fontaine sèche, quelqu'un a repeint le vieux nom du lieu : « Cour Bellerive ».

  — Tu es venu, dit-elle en refermant son parapluie. Je suis Carmen Lisowski. Les gens d'en haut m'appellent Carmen, ou « la Rouge » quand ils ont peur.

  Elle te tend une cassette rayée, de celles qu'on ne fabrique plus depuis un siècle. Sur la tranche, au feutre : « Bande Delta ».

  — De la part de la Société des Antennistes. C'est le vrai nom de l'association des toits. Ils captent tout ce que la Régie diffuse, même ce qu'elle efface.

  *Une cassette*, s'étonne ton assistant. *Il me faudra un lecteur. Ou un musée.*
