narration: |-
  Le gamin aux pieds nus te tire par la manche loin du marché couvert. Au-dessus des toits, la bâtisse aux créneaux découpe le ciel gris.

  — On ne passe pas devant la prison du Guet, souffle-t-il. Pas avec ce que tu portes.

  Il s'engouffre dans la ruelle sans lanterne, si étroite que tes épaules frôlent les murs.

  — Ici, c'est la Venelle des Muets. Les Chiffonniers de la Basse-Ville la tiennent depuis l'hiver. Même la Fraternité des Portefaix n'y entre pas sans payer.

  — Et les hommes en gris ?

  — La Main Grise. Ils paient mieux que le Guet, et ils tuent plus vite.

  Au bout de la venelle, une porte basse s'ouvre sur l'atelier d'un relieur. Deux portefaix au brassard bleu en gardent l'entrée.

  — La Fraternité du Pont, précise le gamin. Rien à voir avec les Portefaix : ceux-là se détestent depuis toujours.

  *La Tour de la Pie sonne minuit*, note Noctule. *Et le grand marché ferme ses grilles derrière nous.*
