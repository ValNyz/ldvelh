narration: |-
  L'air du pont hydroponique colle à la peau. Entre deux rangées de tomates, Aurèle Dussault arrache des racines mortes.

  — La Fraternité est passée cette nuit, grogne-t-il. Ils ont pris trois bacs de semences. Pour leurs « réserves du retour ».

  — Ils les stockent dans les Archives, dit Tilio. Je les ai vus.

  — Et les Mécaniciens ne bougeront pas. Ils ont trop peur de la Nef.

  Il te tend ta carte de rationnement, tamponnée pour la semaine.

  — Va voir si le pont 7 a encore de l'eau. Par la coursive inondée, c'est plus court.
