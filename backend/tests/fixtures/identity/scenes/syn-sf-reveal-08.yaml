narration: |-
  Dans le carré du Grappin, le survivant au bras mécanique pose enfin sa tasse.

  — Hollis. Ezra Hollis, second mécanicien de l'Albatros-9. Les passagers dormaient tous dans la salle aux hublots murés. La Nurserie, on l'appelait. J'étais le seul réveillé quand c'est arrivé.

  Bastien branche la boîte noire sur la console. L'écran affiche aussitôt son identifiant, « Enregistreur AL9-B », puis le nom du propriétaire : « Armement Valtera ».

  — Valtera, répète la Capitaine. Ce sont eux qui n'ont jamais payé les familles.

  *L'AL9-B contient quarante heures de son*, précise Nox. *Je commence par la fin ?*
