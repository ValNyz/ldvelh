narration: |-
  La Capitaine distribue le matériel sans un mot de trop. Elle te lance la découpeuse, puis ton scanner, que tu accroches à ta ceinture.

  — Clou, tu poses la balise dès qu'on est à bord. Si l'Union voit une épave sans balise, elle la déclare libre et on perd tout.

  Le mécano bavard lève le pouce.

  — Et le contrat ? demande-t-il.

  — Signé ce matin avec Kessel. L'assureur prend quarante pour cent, on garde le reste.

  Les lumières de la soute avant passent au rouge. Dans ton casque, la voix grésillante compte à rebours.

  *Arrimage à l'Albatros dans soixante secondes. Yanis, ferme ta visière.*
