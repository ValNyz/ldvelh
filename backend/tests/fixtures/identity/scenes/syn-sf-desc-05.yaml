narration: |-
  Le soir tombe sur le marché couvert. La marchande aux lunettes rondes range son étal en hâte.

  — Les hygiénistes arrivent, souffle-t-elle. Et les contrebandiers ont déjà filé par les toits.

  — Qui les a prévenus ?

  — L'administration, qui d'autre ? Elle vend ses rondes à qui paie. Même les bricoleurs des toits le savent.

  Le garde aux dents dorées passe devant l'étal sans s'arrêter, sa matraque battant contre sa cuisse.

  *Range la mallette à drones*, dit Grain. *Et le flacon aussi.*
