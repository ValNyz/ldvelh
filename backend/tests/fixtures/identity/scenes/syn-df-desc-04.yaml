history:
- text: |-
    Anselme Daguerre a réuni les frères dans la salle du chapitre. Bastien Corlay s'est assis à sa place sans qu'on l'y invite, la lanterne posée devant lui comme un témoin.

    *Il veut que tout le monde la regarde*, note Isaure.
