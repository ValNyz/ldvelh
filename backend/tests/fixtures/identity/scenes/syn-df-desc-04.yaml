narration: |-
  Le prêtre borgne frappe la table du plat de la main.

  — L'Inquisition n'a aucun droit sur ce monastère !

  L'homme à la lanterne verte ne se lève pas.

  — La secte a des fidèles jusque dans la salle des copistes. La procession des pénitents passe chaque nuit sous vos fenêtres, et l'os de la martyre noircit dans sa châsse. Vous appelez ça la paix ?

  Au fond de la salle, le gros moine au trousseau compte ses clés sans lever la tête.

  *La confrérie des inquisiteurs m'a brûlée pour moins que ça*, souffle Isaure. *Il ferait mieux de se taire.*
