narration: |-
  Quarante minutes pour remonter de la rampe arrière jusqu'à la Proue, à contre-courant de la relève. L'air filtré de Vergence te pique les narines. Après trois semaines à respirer à travers ton masque, il a un goût de graisse chaude et de poussière recuite. Sous tes semelles, le grondement des chenilles remonte dans les tibias, régulier et énorme. Tu l'avais oublié.

  La coursive de transit est pleine. Une famille d'échangeurs d'une autre cité attend devant le guichet de contrôle, assise sur des ballots ficelés. Le gamin dort contre un sac de tubercules. Des chenilleurs en fin de quart passent en traînant leurs paquetages. L'un d'eux parle trop fort à son collègue :

  — Paraît qu'ils coupent un poste chez les sondeurs. Avant la convergence.

  L'autre hausse les épaules, et la phrase se perd dans le vacarme.

  Près de la baie de proue, Pater Ondrev se tient au milieu d'un petit cercle de pilotes. Un jeune mécanicien lui crie presque dans l'oreille :

  — Pater ! La balise quarante, on la passe ce soir ou demain ?

  — Le vaisseau ne se presse jamais, mon fils, répond Ondrev en levant une main ample.

  Le mécanicien fixe l'oracle un moment, puis s'éloigne sans insister.

  Contre ta hanche, dans l'étui, un des pieux résonants vibre. C'est faible et bref. Tu n'as rien planté, et aucune mission n'est en cours.

  *Sons depuis la rampe : quarante-trois. Moteurs, voix, un enfant qui ronfle. Un non classé. Hanche gauche.*

  Derrière le pupitre du Corps, Dagny Oduya-Ferrand lève les yeux de sa tablette. Ses cernes sont plus creux que dans ton souvenir. Elle ne se lève pas.

  — Calvène. Tu es rentrée par l'arrière ? Le treuil avant marchait, pourtant. Elle tapote déjà autre chose sur l'écran. Rapport d'avant-piste complet demain, huit heures. Relevés bruts, pas de commentaires. Sec.

  Elle attend une réponse à sa première question. Pas longtemps, semble-t-il.
