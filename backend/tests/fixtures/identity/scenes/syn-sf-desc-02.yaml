narration: |-
  Dans le bar à l'enseigne de poisson, le vieux vendeur de nouilles a installé sa marmite près de la porte. Hugo lève son verre vers toi.

  — À ta vieille coque, qui nous a ramenés entiers. Et à l'administration portuaire, qui ne nous a pas encore retrouvés.

  Wen ne trinque pas. Elle fixe le vendeur par-dessus son épaule.

  — Il était déjà là quand j'ai fouillé la chambre froide, murmure-t-elle. Le jour où les blouses blanches ont vidé la boîte de mousse.

  *Elle a raison*, confirme Oko. *Il était posté devant le hall des contrôles, ce jour-là.*

  Tu poses la main sur ton arme, sous la table.
