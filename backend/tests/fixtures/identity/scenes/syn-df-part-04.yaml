history:
- text: |-
    Le jour se lève gris sur Port-Cendre. Les mouettes se disputent les têtes de poisson que les écailleuses jettent par les fenêtres.

    *Sors-moi de ce sac, que je voie la ville*, réclame Grimaud. *Je te dirai où sont les ennuis.*
