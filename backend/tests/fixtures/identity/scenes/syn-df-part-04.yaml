narration: |-
  *Longe le port vers l'est*, ordonne le crâne, calé dans le creux de ton bras.

  Tu traverses le marché, puis le quai, où trois cordes vides se balancent au gibet. Au bout de la jetée, la Veuve dresse sa tour blanchie de fiente.

  *Le phare a éteint sa lampe la nuit où la Bande a coulé le cotre de la Douane*, raconte Grimaud. *Depuis, plus personne ne paie l'octroi.*

  Tu déplies ta carte sur une borne : la Guilde y a marqué les passes à l'encre rouge. Par ta longue-vue, tu distingues le bassin et son portail rouillé. Tu replies le parchemin.

  *Rentre à l'auberge*, conseille le crâne. *Ce soir, ce quai sera plein de gens qui ne veulent pas être vus.*
