narration: |-
  Le Prévôt ne touche pas à son vin. À sa droite s'est assis un second homme en manteau gris, plus jeune, le visage grêlé, qui lui parle à l'oreille avant de se tourner vers toi.

  — Mon cousin vous a fait venir pour rien, dit-il. Le Boucher ne tue pas dans les beaux quartiers. Il tue près de la Fosse aux Suifs, sous les tanneries. Allez-y ce soir.

  Le Prévôt pose sur la table une clé de fer noir et une chevalière d'argent frappée d'une tour.

  — L'une ouvre la grille, l'autre vaut ma parole auprès des gardes. La Guilde des Tanneurs se plaint déjà que les Équarrisseurs lui volent ses ouvriers ; je ne veux pas d'une guerre de corporations en plus.

  Tu empoches les deux ; le métal tinte contre ta chevalière d'onyx.

  *Deux bagues, deux maîtres*, note Vespérine. *Méfie-toi de celui qui offre la seconde.*
