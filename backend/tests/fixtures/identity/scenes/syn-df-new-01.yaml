history:
- text: |-
    La salle du fond du Croc sent la bière aigre et le suif. L'homme au manteau gris t'y attend déjà, dos au mur, une chope intacte devant lui.

    — Asseyez-vous, dit le Prévôt. J'ai peu de temps et beaucoup de morts.

    *Il compte ses morts comme ses pièces*, murmure Vespérine.
