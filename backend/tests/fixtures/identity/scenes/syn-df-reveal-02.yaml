    Tu t'agenouilles près du cadavre. Ses doigts sont crispés sur le manche, et sa ceinture porte une bourse fermée d'un cachet de cire.

    *Regarde la lame avant la bourse*, conseille Vespérine. *Les lames mentent moins.*
