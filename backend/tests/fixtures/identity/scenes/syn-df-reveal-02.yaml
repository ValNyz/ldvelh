narration: |-
  Tu dégages le tranchoir des doigts raidis. Sur le plat de la lame, sous la crasse, quelqu'un a gravé un nom en lettres anciennes : Mâchefer.

  *Mâchefer*, répète Vespérine, et sa voix se fait plus froide encore. *J'ai déjà entendu ce nom. Pas dans une bouche honnête.*

  Tu brises le cachet de la bourse. La cire porte un crochet entouré de lettres serrées : « Confrérie du Crochet ».

  — La Confrérie, lit Jorin par-dessus ton épaule. Alors c'est eux, les masques. Pas le Boucher.

  Au bout de la ruelle, des torches approchent. La Garde prévôtale, enfin, ou quelqu'un qui en porte les couleurs.
