history:
- text: |-
    Le corps gît en travers du caniveau, le visage caché par un masque de cuir cousu de fil rouge. Un de la bande aux masques de cuir, comprends-tu, mais celui-ci ne rôdera plus.

    Jorin recule contre le mur.

    — Il tient encore le tranchoir à manche d'os, souffle-t-il. Je touche pas à ça.
