narration: |-
  Quand ta lame touche sa nuque, la servante lâche le coffret. Le couvercle s'ouvre sur un os jauni, couché sur du velours. Gravé à l'intérieur du couvercle : « Reliquaire d'Aubin ».

  — Ne me tuez pas, souffle-t-elle. Je m'appelle Clémence. Clémence d'Orgemont. Le Baron est mon oncle, mais ce n'est pas ma famille qui m'envoie.

  — Qui, alors ?

  — Le Cercle de Cendre. Ils veulent le reliquaire avant la nouvelle lune.

  *Le Cercle*, répète Brume. *Je croyais que ce n'était qu'une histoire pour effrayer les novices.*
