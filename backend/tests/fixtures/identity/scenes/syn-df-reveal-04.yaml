history:
- text: |-
    Tu as suivi la servante aux yeux vairons jusqu'aux ruines de l'Oratoire Saint-Aubin. Elle s'agenouille sous l'autel brisé, déplace deux dalles et en tire le coffret de plomb.

    *Elle sait exactement où creuser*, murmure Brume.
