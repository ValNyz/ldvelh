narration: |-
  Le gamin aux mains brûlées te pousse dehors par une porte basse, loin des crochets. Il fait presque nuit.

  — T'as payé la Doyenne, alors t'as le droit de savoir mon nom, lâche-t-il. Jorin. Jorin Saulce, si tu veux tout. Je fonds le suif pour la Halle.

  Il t'entraîne dans la ruelle derrière les abattoirs, où le caniveau charrie une eau rosâtre. Au coin, une plaque rongée de rouille porte encore des lettres : Venelle des Saigneurs.

  — C'est ici qu'ils ont trouvé la dernière, dit Jorin. La bande aux masques de cuir traîne par ici à la nuit tombée. Le Prévôt dit que c'est le Boucher. Moi, je dis que le Prévôt dit beaucoup de choses.

  *La venelle porte bien son nom*, glisse Vespérine. Tu tournes machinalement ta chevalière autour de ton doigt.
