history:
- text: |-
    La Doyenne referme le poing sur tes pièces.

    — Le gamin va te montrer la sortie de derrière. Ceux qui sortent par devant, la Garde prévôtale les compte.

    *Elle t'a jaugé comme on jauge un cochon*, note l'esprit de ta chevalière.
