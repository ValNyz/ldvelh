narration: |-
  Le barman aux tatouages lumineux fait glisser un bol de bouillon sur le zinc et tapote son propre badge, où ne s'affiche qu'un logo effacé.

  — Tu veux savoir à qui tu dois tes trois crédits ? Amaru Quispe. Mais tout le monde dit Amaru, sauf la Compagnie quand elle m'envoie ses factures.

  Au bout du comptoir, l'homme au manteau gris a posé la mallette scellée sur ses genoux. Quand il la retourne pour l'ouvrir, tu lis sur l'étiquette pelliculée : « Lot H-114 ». Il la referme aussitôt.

  *Le Lot H-114*, répète ton IA tout bas. *Je l'ai noté. Jonas, ne le fixe pas comme ça.*
