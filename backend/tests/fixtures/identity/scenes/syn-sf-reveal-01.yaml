history:
- text: |-
    Tu pousses la porte du Comptoir. La salle est basse, enfumée, pleine de foreurs en fin de poste. Le barman aux tatouages lumineux lève à peine la tête.

    *Trois crédits le bol*, annonce la voix dans ton bracelet. *C'est écrit au-dessus de sa tête.*
  mentions:
  - surface: Comptoir
    start: 23
    category: EASY
    expected: MATCH location_comptoir
  - surface: foreurs en fin de poste
    start: 72
    category: SKIP
    expected: SKIP
  - surface: Le barman aux tatouages lumineux
    start: 97
    category: DESC
    expected: MATCH character_amaru_quispe
  - surface: la tête
    start: 143
    category: SKIP
    expected: SKIP
  - surface: la voix dans ton bracelet
    start: 185
    category: PC
    expected: MATCH companion_mire
  - surface: ton bracelet
    start: 198
    category: PART
    expected: MATCH object_bracelet_de_service
  - surface: sa tête
    start: 238
    category: SKIP
    expected: SKIP
- text: |-
    Tu t'assois au bout du zinc. Un peu plus loin, l'homme au manteau gris boit sans rien dire, une mallette aux fermoirs scellés posée contre ses pieds.

    — Trois crédits, dit le barman. Tu payes ou tu regardes ?
  mentions:
  - surface: l'homme au manteau gris
    start: 47
    category: DESC
    expected: MATCH character_corvin_hale
  - surface: une mallette aux fermoirs scellés
    start: 92
    category: DESC
    expected: MATCH object_mallette_scellee
  - surface: ses pieds
    start: 139
    category: SKIP
    expected: SKIP
  - surface: le barman
    start: 172
    category: DESC
    expected: MATCH character_amaru_quispe
