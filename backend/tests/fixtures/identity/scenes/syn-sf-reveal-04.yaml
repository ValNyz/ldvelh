narration: |-
  Le plongeur au scaphandre jaune dévisse son casque. Dessous, un visage maigre, des yeux rougis par le froid.

  — Kaito Brenner, dit-il. On ne s'est jamais présentés. Kaito, ça ira.

  La femme qui tousse serre le cylindre gelé contre elle. Elle essuie sa bouche d'un revers de manche.

  — Et moi, c'est Maud Tessier. J'étais technicienne ici, avant qu'ils murent cette galerie.

  Kaito gratte le givre d'une plaque vissée au mur : « Galerie Flamel, accès réservé ».

  *Galerie Flamel*, répète Sel. *Je l'ajoute à mes plans.*

  Maud tourne le cylindre vers toi. Sur l'étiquette, à moitié effacée : « Échantillon K-7 ».
