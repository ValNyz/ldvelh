narration: |-
  Sous la coupole de l'Observatoire, Ariane a étalé les relevés sur la table lumineuse. Ses mains bandées tremblent un peu.

  — Ariane s'est bloquée à huit cents mètres, dit-elle. La sonde ne répond plus depuis l'aube.

  Le directeur adjoint au sourire figé croise les bras.

  — L'Observatoire ne financera pas une deuxième descente. Et Narval ne nous prêtera pas son matériel gratuitement.

  — On a déjà le Narval, réplique Ariane Sauvage. Il dort dans le hangar depuis trois semaines.

  *Le submersible est chargé à quarante pour cent*, précise la voix des haut-parleurs. *Assez pour une descente. Pas pour un retour, si Noor traîne.*
