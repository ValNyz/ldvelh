narration: |-
  Un héraut aux couleurs d'Orgemont arrête son cheval au pied des murailles et déroule un parchemin.

  — Vauclair a trahi la parole donnée ! crie-t-il. La Maison d'Orgemont réclame réparation : le Cœur de Morne, livré dans son coffre, avant la nuit.

  Sur le chemin de ronde, Vauclair en personne s'avance, le voile relevé.

  — Dites à votre maître que Cœur de Morne est à nous depuis trois siècles, ses galeries comme ses morts. Et que les murs de Vauclair ont déjà vu des barons pourrir à leur pied.

  *Elle a parlé de la mine, pas de la pierre*, note Brume. *Elle n'a aucune intention de la rendre.*
