- text: |-
    La pause est longue. Le gérant attend toujours, la louche au-dessus de la marmite.

    *Un programme. Je peux te donner un ordre possible, pas un ordre à suivre.* Un temps. *Un : demander à quelqu'un où est la Serre Numéro Quatre. Il y a quelqu'un devant toi. Deux : être à la serre à huit heures. Trois : passer au Bureau des Résidences pendant ta pause, si tu en as une. Ton contrat le dit peut-être. Tu ne l'as pas lu.* Encore un silence. *Quatre : décider si tu veux le fond de bouillon. Il attend.*

    Le Kethari au tablier n'a pas bougé. Son terminal vibre une troisième fois sous sa paume. Il ne le regarde pas.

    — Alors ? dit-il. Oui ou non, j'ai la plonge à faire.

    Dans son coin, la Kethari âgée a rangé sa boîte et te fixe maintenant, ouvertement, comme si elle aussi attendait ta réponse.
