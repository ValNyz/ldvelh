narration: |-
  La Kethari âgée cligne lentement des yeux, comme si la question venait de loin.

  — Nahle Irun-Sa, dit-elle. Nahle suffit. Le reste, c'était pour les formulaires de mon ancien habitat. Ici, je ne sais pas encore ce qu'ils voudront.

  Elle resserre les doigts sur la poignée de sa valise.

  — Et toi ? Si je dois marcher derrière quelqu'un, autant savoir comment l'appeler quand il va trop vite.

  Derrière le comptoir, le Kethari au tablier empile les bols sales sans un bruit. Sa poche de tablier s'allume à travers le tissu, puis s'éteint.

  *Six heures cinquante-deux*, dit la voix basse sur ton terminal. *Ton bol est vide.*
