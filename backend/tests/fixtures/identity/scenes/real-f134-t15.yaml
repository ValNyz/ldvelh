- text: |-
    Tu poses neuf crédits sur le lecteur. Le Kethari au tablier remplit un bol jusqu'au bord, ajoute un carré de pain d'algue grisâtre et pousse le tout vers toi sans un mot.

    Le bouillon est trop salé, un peu terreux, avec des morceaux de racine qui fondent sous la dent. Le pain d'algue est caoutchouteux mais trempé dedans, ça passe. Tu vides le bol jusqu'à racler le fond avec la croûte.

    Quand tu lèves les yeux, le gérant te regarde, la louche toujours en main.

    — Il en reste un fond, dit-il. Je te le mets ? Ça sera jeté sinon.

    Sous sa paume, le terminal vibre de nouveau. Cette fois il le retourne, lit, et sa mâchoire se crispe. Il le repose face contre le comptoir, un peu trop fort. Dans son coin, la Kethari âgée a relevé la tête au bruit.

    *Six heures vingt-deux*, dit la voix basse sur ton terminal. *Il te reste une heure trente-huit. Et tu ne sais toujours pas où est la Serre Numéro Quatre.*
