- text: |-
    La Kethari âgée hoche lentement la tête, comme si la réponse lui convenait.

    — Rien de passionnant, c'est ce qui tient le plus longtemps, dit-elle. Les tubercules non plus, ce n'était pas passionnant.

    Elle regarde ton bol presque vide, puis la porte de la coursive.

    — Mes yeux ne lisent plus les petites lettres. Si tu passes devant ce panneau, je marcherai derrière toi. Je ne suis pas pressée. Personne ne m'attend, de toute façon.

    À la plonge, le Kethari au tablier a coupé l'eau. Il revient essuyer le comptoir et ramasse son terminal au passage. Il le glisse dans la poche de son tablier sans le regarder.

    *Six heures cinquante*, dit la voix basse sur ton terminal. *Le panneau est sur le chemin. Elle, elle a dit qu'elle n'était pas pressée. Toi, tu l'es un peu.*
