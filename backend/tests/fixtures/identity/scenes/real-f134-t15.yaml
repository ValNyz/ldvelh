- text: |-
    — Pas de pardon, grogne le Kethari au tablier.

    Il racle la marmite et verse le fond dans ton bol. C'est plus épais, presque une purée, avec des fils de racine collés au bord. Il ajoute le dernier coin de pain d'algue sans rien demander, puis emporte la marmite vers la plonge. L'eau se met à couler et son terminal reste sur le comptoir, face contre le métal. Il vibre encore une fois, tout seul.

    Pendant que tu manges, la Kethari âgée se lève. Elle traverse la cantine en tirant sa valise, dont une roue grince, et s'arrête à deux pas de ta table.

    — Tu viens de la navette aussi, dit-elle. Ce n'est pas une question. On devait m'attendre au quai. Personne. Tu sais où est ce Bureau des Résidences, toi ?

    Au fond, le type en bleu de travail remue sur son plateau et grommelle quelque chose dans son sommeil.

    *Tu ne le sais pas non plus*, remarque la voix basse sur ton terminal. *Mais le panneau du hall, lui, le savait.*
