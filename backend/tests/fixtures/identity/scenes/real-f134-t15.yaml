- text: |-
    La Kethari âgée ne répond pas tout de suite. Elle pose les deux mains sur la poignée de sa valise, comme sur une canne.

    — Pour finir, dit-elle. Mon habitat ferme son aile des anciens. On nous a répartis là où il restait des lits. Ici, il en restait un. Elle hausse une épaule. J'ai cultivé des tubercules pendant quarante ans. Ils ont dû trouver ça logique.

    Elle jette un regard vers la porte de la coursive, puis revient sur toi.

    — Et toi ? Tu n'as pas l'air de quelqu'un qu'on attendait non plus.

    À la plonge, l'eau s'arrête de couler. Sur le comptoir, le terminal du Kethari au tablier vibre une fois de plus dans le vide.

    *Le panneau est sur le chemin de la serre*, note la voix basse sur ton terminal. *Elle marche lentement. Je le dis, c'est tout.*
