narration: |-
  La Méridienne se pose en douceur sur un pad d'Hélios, entre deux tours de verre. La pilote au casque jaune coupe les moteurs et se retourne.

  — Bienvenue dans les quartiers hauts. Tout ce que tu vois appartient à Hélios, la corpo, mais ça, tu le savais déjà.

  Elle détache son casque.

  — Au fait, moi, c'est Joss Kerrigan. Joss, si tu me rappelles un jour.

  Tu dois rejoindre Dalia Vrenn à la Méridienne, le quartier des docks, avant le couvre-feu. Ta navette ne peut pas t'y emmener : la corporation interdit les vols bas après dix-huit heures.

  *La Méridienne reste garée ici*, confirme Sillage. *Dalia t'attend en bas, à vingt minutes de tram.*
