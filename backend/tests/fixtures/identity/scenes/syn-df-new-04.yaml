narration: |-
  Sur le parvis de l'église du village, un second prêtre borgne, jeune, le bandeau sur l'œil gauche, attend le Prieur et l'apostrophe sans le saluer.

  — Les Sœurs de la Cendre ont pris une autre fille cette nuit. Elles l'ont emmenée au cloître des Pénitentes, de l'autre côté de la rivière, pas dans le vôtre.

  Anselme détourne la tête sans répondre. C'est donc vers toi que l'autre se tourne. Il te glisse dans la main une fiole de cire noire et une seconde clé d'os, plus courte que Passe-Tombe.

  — Si vous la cherchez, passez par la chapelle Saint-Lô. Et méfiez-vous du chien du portier.

  *Deux borgnes et deux clés*, souffle Isaure. *Le Seigneur aime les répétitions, ou bien quelqu'un se moque de toi.*
