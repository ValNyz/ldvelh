- text: |-
    Tu poses ta bourse sur le billot. La Doyenne la soupèse, puis désigne du menton le gamin aux mains brûlées qui traîne un seau de suif.

    — Lui te montrera la relique. Le Couperet de Saint Varon ne sort pas de sa grille, mais on a le droit de le regarder.

    Le gamin s'essuie les mains sur sa chemise et te fait signe de le suivre.
