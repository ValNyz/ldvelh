narration: |-
  Au fond de la Halle, derrière un rideau de cuir, s'ouvre un renfoncement voûté, noir de suie. Le gamin aux mains brûlées lève sa chandelle vers une niche grillagée. Dedans, posé sur un linge rouge, le grand couperet à lame noire luit faiblement.

  — On le sort pour la fête des saigneurs, murmure-t-il. La corporation jure dessus depuis deux cents ans.

  Des pas lourds résonnent dans le grand hall aux crochets. L'homme au tablier de cuir passe devant l'arche sans s'arrêter. Vous vous taisez tous deux jusqu'à ce que le bruit s'éloigne.

  — Celui-là, souffle-t-il, la vieille ne le laisse jamais seul avec la relique.

  *Il a peur de lui*, remarque la voix froide à ton oreille. *Pas comme on a peur d'un maître.*

  Tu effleures ta chevalière. Sur le linge rouge, une chevalière de cuivre sert de cale au manche.
