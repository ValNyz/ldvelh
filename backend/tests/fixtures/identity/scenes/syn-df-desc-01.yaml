history:
- text: |-
    La Halle des Équarrisseurs sent le sang caillé et la graisse chaude. Sous les crochets, la vieille femme aux bagues de fer compte des pièces sur un billot. Derrière elle, l'homme au tablier de cuir affûte une lame sans lever les yeux.

    — La Guilde ne reçoit pas les curieux, dit Ancelise Morvan. Elle reçoit les payeurs.

    *Elle ment sur le premier point*, souffle Vespérine. *Pas sur le second.*
