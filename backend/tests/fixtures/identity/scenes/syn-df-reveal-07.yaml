history:
- text: |-
    Tu as suivi le pèlerin encapuchonné jusqu'au fond de la crypte. Il s'est assis sur le tombeau d'une abbesse, le livre relié de peau ouvert sur ses genoux, comme s'il t'attendait.

    *Il ne respire pas*, chuchote Isaure. *Pas plus que moi.*
