narration: |-
  Au fond du Caveau des Abbesses, le pèlerin referme le livre et le serre contre lui.

  — Vous voulez des noms, dit-il. Celui-ci est le Codex de Vael. Il a été écrit avant l'abbaye, avant même le village.

  Il rabat son capuchon. Le visage, dessous, est gris comme la pierre des tombes.

  — Et moi, je suis Ysmer de Saël. Ceux qui gardaient ce livre avec moi se nommaient les Veilleurs du Puits. Il n'en reste qu'un.

  *Ysmer*, répète Isaure. *Le saint de la Lanterne. Il devrait être poussière depuis trois cents ans.*
