- text: |-
    La pause, cette fois, est franchement longue.

    *J'avais compris*, dit Pervenche. *Je ne t'en proposerai pas de ce genre-là. Ce n'est pas de la pudeur, je n'ai rien qui irait avec.* Un silence. *Le champ est à toi. Tape ce que tu veux, je répondrai. Je ne choisirai pas à ta place.*

    Le curseur clignote toujours dans le champ vide. La porte de la coursive s'est refermée sur la Kethari âgée. Il ne reste dans le hall que les deux adolescentes, qui ont fini par renoncer à leur sac et le traînent ensemble vers la sortie *Résidences*, en laissant derrière elles une traînée de chaussettes.

    Ton terminal affiche maintenant 05h56. Au-dessus de la borne en panne, un deuxième plafonnier commence à grésiller.
