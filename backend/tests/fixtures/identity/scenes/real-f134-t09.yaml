- text: |-
    Rien pendant une seconde. Puis :

    *Pardon. Je n'ai pas encore l'habitude de « clown ».* Une pause. *Je ne décide pas pour toi. Je peux te donner les faits. Le Bureau des Résidences ouvre à huit heures. Ta prise de poste est à huit heures. Tu ne seras pas aux deux endroits à la fois.* Encore un silence. *La Cantine du Puits est ouverte. Elle est à trente mètres.*

    Par la porte entrouverte, le raclement de louche s'est arrêté. Une voix grave annonce quelque chose que tu ne comprends pas. Ça ressemble à « plus de galettes ». Quelqu'un répond par un soupir.

    À tes pieds, ta valise souple s'est affaissée sur le côté.
