- text: |-
    Tu tapes les deux mots. Le champ les accepte, et la fenêtre de confirmation se referme presque aussitôt. *Nom d'appel : Clown taquin.* « Pervenche » disparaît de la ligne grisée.

    La pause qui suit est la plus longue depuis ton arrivée.

    *Enregistré*, dit la voix, toujours aussi basse et neutre. *Je ne sais pas rigoler sur commande. Je peux répondre à Clown taquin. C'est déjà beaucoup pour un clown.* Un temps. *Il est cinq heures cinquante-huit. Tu n'as rien mangé depuis la navette.*

    Au-dessus de la borne, le plafonnier grésille une dernière fois, puis se stabilise. Le hall est vide, à part toi et les chaussettes oubliées par les adolescentes. Par la porte de la coursive, entrouverte sur la Cantine du Puits, filtre une odeur de bouillon et le raclement d'une louche contre une marmite.
