narration: |-
  Tu attrapes ta valise affaissée et tu traverses le hall. La coursive est courte, basse, tapissée de tuyaux qui suintent. Une flaque s'est formée sous un raccord. Quelqu'un a posé un bac en plastique dessous, déjà plein à moitié.

  La Cantine du Puits occupe un ancien local technique. On voit encore les fixations des machines au sol, sous une couche de peinture jaune écaillée. Six tables, des bancs dépareillés, une baie de service avec deux marmites fumantes et une plaque chauffante vide, encore grasse. Trois clients tout au plus : un type en bleu de travail endormi sur son plateau, et la Kethari âgée, assise dans un coin, sa valise contre les genoux. Près de la baie, une caisse vide sert de cale-porte. Sur son flanc, une étiquette tamponnée : *PROTÉINES TEXTURÉES — LOT 2851-09 — 40 PORTIONS*.

  Derrière la baie, un Kethari au tablier taché fait défiler quelque chose sur son terminal. Il le pose face contre le comptoir quand tu approches.

  — Plus de galettes, dit-il d'une voix grave, sans préambule. Bouillon de racines, neuf crédits. Il y avait du supplément protéines, il n'y en a plus. Désolé. Il reste du pain d'algue d'hier, je le donne avec.

  Il attend, la louche déjà en main. Le terminal vibre sous sa paume. Il ne le retourne pas.

  *Bouillon*, dit ta compagne, après un temps. *Ce sera ton premier repas depuis trente et une heures. Je ne compte pas. Je le note, c'est tout.*
