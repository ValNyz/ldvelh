history:
- text: |-
    Le sac qu'on t'a passé sur la tête sent le goudron. On te fait marcher longtemps, puis descendre des marches. Une porte grince. Quand on t'arrache le sac, Ilse Ferrand se tient devant toi, une lanterne à la main.

    *Je t'avais dit de ne pas la suivre*, souffle Grimaud.
