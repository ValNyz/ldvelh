narration: |-
  Tu es dans un entrepôt sans fenêtres, aux poutres noircies par un ancien incendie. Des tonneaux de harengs s'y empilent jusqu'au plafond.

  — Bienvenue à l'Entrepôt Noir, dit-elle. Ceux qui y entrent n'en sortent pas, d'habitude.

  Au fond, dans un fauteuil à haut dossier, la veuve en noir pose sa tasse.

  — Laisse, ma fille. Je suis Ermengarde Ferrand, et c'est moi qui décide qui sort. Mon fils, le Corbeau, croit commander ce port. Laissons-le croire.

  Elle désigne d'un ongle la médaille rouillée pendue à ton cou.

  — Et tu portes l'Œil de la Marée sans savoir ce que c'est. Où l'as-tu trouvé ?

  *Ermengarde*, répète Grimaud. *On la disait morte depuis dix ans. Visiblement, on la disait mal.*
