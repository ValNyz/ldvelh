narration: |-
  Le ravitailleur se pose près du hangar dans un nuage de neige soufflée. Sur sa coque, les lettres sont enfin lisibles : « Compagnie Borée ».

  Un deuxième plongeur en scaphandre jaune descend la passerelle et serre la main de Kaito.

  — La Borée m'envoie relever ton poste, dit le nouveau venu. Trois ans pour l'Observatoire de Callisto, et voilà où on m'expédie.

  Ariane Sauvage te prend à part et te met dans les mains une balise de détresse et un carnet de relevés neuf.

  — Garde ton vieux carnet pour toi. Celui-là, tu le remplis pour la Sécurité minière jovienne : ils ont ordonné une inspection de la station de pompage Delta, et c'est toi qui y descends.

  *Une inspection le jour où la Borée débarque*, note Sel. *Je n'aime pas les coïncidences.*
