narration: |-
  Mère Gravel pose deux chopes sur la table du marin à la jambe de bois.

  — Lamothe, voilà quelqu'un qui cherche un pilote. Sois poli, pour une fois.

  Il lève les yeux de ses osselets.

  — Un pilote pour où ?

  — Pour la cale sèche abandonnée, dis-tu.

  Il rit sans joie, mais il se lève. À la nuit tombée, il te conduit par le quai jusqu'à un portail rongé de sel. Au-dessus, une enseigne de bois pend encore à sa chaîne : Bassin des Noyés.

  — Personne n'y vient plus depuis que la Douane y a pendu trois hommes, dit-il.

  *Le bassin porte bien son nom*, glousse Grimaud. *J'en connais trois, au fond, qui te le confirmeraient.*
