history:
- text: |-
    L'Auberge Gravel est pleine de dockers trempés. Dans un coin, le marin à la jambe de bois joue seul aux osselets.

    *Celui-là sait des choses*, souffle Grimaud. *Il a les yeux de ceux qui ont trop navigué.*
