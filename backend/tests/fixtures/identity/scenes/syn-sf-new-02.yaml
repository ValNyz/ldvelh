narration: |-
  Le quai 12 est bloqué par un remorqueur aux couleurs de Halsey & Fils. Pétra Novák jure entre ses dents.

  — Ils travaillent pour la Guilde des Mineurs maintenant, dit-elle. Ceux de Ganymède-Bas. La Guilde des Pilotes a perdu le contrat hier soir.

  Un pilote balafré descend du remorqueur et lève la main vers elle.

  — Salut, la Pie. Tu te gares au Quai 14, comme tout le monde.

  Wen te glisse dans la main une licence vierge, encore sous film.

  — Garde ta vraie licence pour les contrôles, souffle-t-elle. Celle-ci t'ouvrira le Quai 14.

  *Deux balafrés sur le même quai*, note Oko. *Je les distinguerai à la voix.*
