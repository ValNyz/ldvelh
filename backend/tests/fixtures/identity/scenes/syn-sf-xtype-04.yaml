narration: |-
  La bulle de la Lanterne flotte au bout du mât, et les étoiles y défilent à l'envers. Boussole est déjà assise au centre, ses yeux blancs tournés vers le vide.

  — Tu as apporté la Lanterne ? demande-t-elle.

  Tu poses la vieille lampe de cuivre entre vous deux. Sa lueur ambrée tremble. Hanna Wöhler tend la main et en effleure le verre.

  — Et la Boussole ? Sans elle, je ne retrouve plus la Nef toute seule.

  Tu sors la boussole de ta poche.

  — La Nef a voté ce matin, reprend-elle. Ils veulent fermer la Lanterne aux civils. Trop de gens viennent y pleurer.

  *Elle parle du conseil*, précise la voix douce dans ton oreillette. *Pas du grand hall.*
