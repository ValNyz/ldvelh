narration: |-
  Oskar Venn referme derrière toi la porte de la Salle des Cartes. Sur la grande table, l'Atlas de Brume attend, grand ouvert.

  — Le Cercle des Cartographes le réclame depuis l'hiver, dit-il. Il ne quittera pas la Bibliothèque des Sables.

  Tu poses à côté la Boussole à eau. Elle tremble, puis se fige vers le nord. Dans ta poche, la Clé de cuivre pèse plus lourd qu'elle ne devrait.

  *L'Atlas de Brume et la Boussole à eau sur la même table*, souffle Pivert. *Le Cercle des Cartographes paierait cher pour voir ça.*
