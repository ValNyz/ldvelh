history:
- text: |-
    La femme au brassard orange t'attend au bout de la coursive de l'Anneau B. Elle ne dit rien, te fait signe de la suivre et s'arrête devant la salle derrière le sas rouge.

    *Elle a regardé derrière elle trois fois*, compte Mire.
