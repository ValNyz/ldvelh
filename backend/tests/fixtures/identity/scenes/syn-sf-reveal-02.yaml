narration: |-
  La femme au brassard orange te pousse derrière le sas rouge et le verrouille d'un coup de coude. La pièce est étroite, couverte de givre. Une plaque émaillée, au-dessus des bouteilles, annonce : « Chambre de Décompression Deux ».

  — Ici, personne n'écoute, dit-elle. Ni Halvard, ni ses auditeurs.

  Elle déplie son brassard : les lettres cousues disent Syndicat des Foreurs Libres.

  — Les Foreurs Libres, corrige-t-elle. Et moi, c'est Dalia. Dalia Okonjo, si la Compagnie te pose la question, et elle le fera.

  *Une porte qui donne sur le vide*, relève Mire. *Je préférais le Comptoir.*
