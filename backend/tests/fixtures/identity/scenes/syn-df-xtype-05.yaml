history:
- text: |-
    La pluie tambourine sur les volets de l'Auberge Gravel. Odile Gravel essuie des chopes derrière le comptoir sans te quitter des yeux.

    *Elle t'a reconnue*, grince Grimaud depuis ta besace. *Elle reconnaît tous ceux qui lui doivent de l'argent.*
