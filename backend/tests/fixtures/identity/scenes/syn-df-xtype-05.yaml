narration: |-
  La porte s'ouvre sur le vent salé. Le borgne au manteau goudronné entre le premier, suivi de la rousse aux bras tatoués.

  — Gravel, une bouteille, lance-t-il. Et pas de ta piquette.

  — Tu m'en dois déjà trois, Ferrand, grogne la grosse femme au tablier taché en posant le flacon devant lui.

  Le Corbeau s'assied face à toi sans demander la permission. Sous la table, ta main trouve ton couteau.

  — Le Corbeau a besoin d'un pilote, dit-il. Le dernier a eu un différend avec la Capitainerie.

  — On l'a repêché devant la Capitainerie, précise-t-elle. Les mains liées dans le dos.

  — On en reparle demain, ici même, chez Gravel.

  *Ici, tout le monde porte le nom de quelqu'un d'autre*, ricane le crâne dans ta besace. *L'auberge porte un nom de femme, la bande un nom d'oiseau. Même moi, j'avais un nom, avant.*
