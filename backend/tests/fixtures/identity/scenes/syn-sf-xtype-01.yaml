narration: |-
  Sous la verrière noircie de la Forge, les marteaux pneumatiques couvrent presque les voix. Teodor s'essuie les mains sur son tablier de cuir et te rend ta foreuse, réparée.

  — Le joint tiendra. Si Lindqvist te demande qui l'a remise en état, dis que c'est moi. Ma sœur ne croit jamais que je finis un travail.

  Au fond, un apprenti crie : « Lindqvist, ta pause est finie ! » et le mécanicien roux lève la main sans se retourner.

  Saskia Lindqvist entre à cet instant, son casque rayé sous le bras.

  — La Forge a voté, annonce-t-elle. Les fondeurs suivent la grève. Halvard va hurler.

  *Deux Lindqvist dans la même pièce*, murmure Mire. *Je te conseille les prénoms.*
