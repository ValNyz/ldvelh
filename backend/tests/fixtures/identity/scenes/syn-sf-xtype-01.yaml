history:
- text: |-
    La contremaîtresse au casque rayé t'a donné rendez-vous à la Forge, de l'autre côté de l'Anneau B. Tu y arrives avec ta foreuse portative en bandoulière, le joint encore fendu.

    *Le mécanicien s'appelle Teodor*, précise Mire. *C'est son frère. Elle l'a dit deux fois.*
