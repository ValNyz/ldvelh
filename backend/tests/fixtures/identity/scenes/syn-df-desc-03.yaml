narration: |-
  Le vieil homme à la canne d'ivoire lève sa coupe vers la femme au voile d'argent.

  — À la mine, dit-il, et à ce qu'elle cache.

  Ta suzeraine ne boit pas.

  — La pierre noire n'est pas à vendre, Baron. Ni cette forteresse.

  — Tout est à vendre, sourit-il. La compagnie de mercenaires qui garde vos routes, par exemple. Elle sert désormais ma lignée.

  Sous la table, tu sens le poids de ta lame contre ta cuisse.

  *Il veut que tu dégaines*, souffle ta chouette. *Ne lui fais pas ce plaisir.*
