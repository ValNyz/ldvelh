narration: |-
  Le sergent Voss t'attend au bout du Quai 7, les bras croisés sur son gilet de la Sécurité des Quais. À côté de lui, une jeune femme en combinaison de plongée tire sur ses gants d'un coup sec.

  — Mila Voss, dit-elle. Je remplace l'équipe de nuit depuis ce matin.

  Hadrien hoche la tête sans la regarder.

  — Ma nièce. Elle arrive de la surface, elle ne connaît encore personne sur la station. Si tu cherches Voss pour tes analyses, la médecin aux gants bleus est au laboratoire depuis six heures.

  Le haut-parleur grésille au-dessus du sas : « Voss, au treuil numéro deux. » Le sergent soupire et décroche sa radio.

  — Elara et moi, on n'a que le nom en commun, ajoute-t-il. Ne laisse pas la Sécurité te dire le contraire.

  *Ton badge ouvre encore le Laboratoire médical*, murmure la voix de ton bracelet. *Dr. Elara Voss a signé tes résultats à six heures douze.*
