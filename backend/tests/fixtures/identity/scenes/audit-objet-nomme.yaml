narration: |-
  Maître Olbert pose l'épée sans fourreau sur le comptoir et frotte la garde avec un chiffon gras.

  — Il y a des runes sous la crasse, murmure-t-il. Regarde : « Veillenuit ». C'est son nom. Les vieilles lames en avaient toujours un.

  Tu reprends ta lame. Elle te semble soudain plus lourde.

  Le vieil antiquaire ouvre ensuite le coffret de fer que tu as rapporté des ruines. Sur le couvercle, une plaque d'argent ternie porte une inscription : Coffret des Sept Clés.

  — Le Collège des Runistes paierait une fortune pour ce coffret, dit Olbert. Mais les Runistes posent trop de questions. Garde-le, et garde ton arme près de toi.

  *L'épée a vibré quand il a dit son nom*, souffle Noctule. *Veillenuit. Ça lui va bien.*
