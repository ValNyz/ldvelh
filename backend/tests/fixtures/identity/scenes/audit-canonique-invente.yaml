narration: |-
  Le forgeron borgne tourne ta dague brisée entre ses doigts et fait jouer le tranchant contre sa paume.

  — Mauvais acier, dit-il. Ça ne sort pas d'un atelier de la Guilde.

  Il repose son marteau sur l'enclume. Au fond de la forge, un gamin couvert de suie lâche le soufflet.

  — Garrec, le charbon est presque fini ! crie le gamin.

  — Alors va en chercher, grogne l'homme au tablier de cuir. Et arrête de brailler mon nom devant les clients.

  L'apprenti file par la porte de derrière. Le forgeron te rend ta dague en serrant la mâchoire.

  — Reviens après le couvre-feu. La Guilde des Ferrons m'interdit de toucher l'acier étranger, mais la nuit, les maîtres de la guilde dorment.

  *Je retiendrai le nom*, souffle Noctule contre ton oreille.
