history:
- text: |-
    Le forgeron borgne frappe une dernière fois, puis essuie sa paume sur son tablier. L'homme au tablier de cuir ne lève pas les yeux quand tu entres dans la Forge de la Rue Basse.

    — Pose ça là, dit-il en montrant ta dague du bout de son marteau.
