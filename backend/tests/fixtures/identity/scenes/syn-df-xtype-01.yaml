history:
- text: |-
    Tu dors mal, sur une paillasse au-dessus des fosses à suif. Avant l'aube, Jorin te secoue l'épaule.

    — Lève-toi. La Halle s'assemble. Quand ça arrive, tout le monde descend, même l'homme au tablier.

    *Il a dit ça comme on parle d'un loup*, remarque Vespérine.
