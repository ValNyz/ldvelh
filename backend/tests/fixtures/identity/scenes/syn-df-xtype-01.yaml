narration: |-
  Le bourdon de la Doyenne fait trembler les crochets : trois coups, puis un quatrième, plus long. Dans la Halle, tous les couteaux s'arrêtent.

  — Quatre coups, on convoque, dit Jorin. La Halle va juger quelqu'un. Le conseil de la corporation siège déjà.

  Sur l'estrade, la Doyenne lève une main lourde de bagues. Au-dessus d'elle, la cloche vibre encore.

  — Les Équarrisseurs ont perdu un des leurs cette nuit, dit-elle. On l'a retrouvé pendu à son propre crochet. Le Boucher entre chez nous, maintenant.

  Un murmure court dans les rangs. Au premier rang, l'homme au tablier de cuir croise les bras.

  *Une cloche et une vieille qui portent le même nom*, s'amuse Vespérine. *Dans cette ville, on ne gaspille même pas les mots.*
