narration: |-
  Sur la passerelle de l'Albatros-9, le survivant au bras mécanique n'est pas seul. Une femme au bras mécanique se tient près de lui et lui parle à voix basse.

  — Je suis Sigrun, dit-elle en se tournant vers toi. On vient de l'Albatros-7, le vaisseau jumeau. Il a sombré deux jours avant celui-ci.

  Elle te tend une boîte noire cabossée, identique à la boîte noire sanglée sur ton dos.

  — L'enregistreur de l'Albatros-7. L'Union des Récupérateurs l'a refusé. Ils disent que l'Union des Ferrailleurs le paierait mieux.

  Capucine Ortega fronce les sourcils.

  — Et la Garde côtière de Vesta ? Elle a envoyé un cotre ?

  — Pour nous ? Jamais.

  *Deux bras mécaniques, deux Albatros, deux boîtes noires*, énumère Nox. *Je vais finir par confondre.*
