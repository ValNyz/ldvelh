narration: |-
  La Ruche bourdonne déjà de marchands. Mireille Abadie t'attend derrière son étal, ses lunettes rondes remontées sur le front.

  — Tu as toujours la Ruche ? Ouvre-la.

  Tu poses la valise sur le comptoir et en déverrouilles les fermoirs. Les douze drones dorment dans leurs alvéoles.

  — Bien. Le Sablier veut te les louer pour une nuit. En échange, ils déchiffrent le Sablier que tu traînes depuis des semaines.

  Tu sors la petite clé de verre de ta poche. Le sable numérique y coule toujours vers le haut.

  — Le Sablier déchiffre tout, dit Mireille en haussant les épaules. Contre service.

  *Je n'aime pas qu'on loue la Ruche à des gens qui portent le même nom que ta clé*, maugrée Grain.
