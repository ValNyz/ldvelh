narration: |-
  Le conseil s'est réuni sous le grand dôme vitré. Lionel Sarrazin préside, les mains à plat sur la table.

  — Nos fournisseurs réclament le prélèvement, dit-il. Ils ont payé la moitié de la mission.

  — Pas avant qu'on sache ce qu'il y a dedans, répond la glaciologue. Et pas avant d'avoir sondé l'eau sombre sous la glace.

  — Avec quoi ? La vieille coque jaune est à sec, et les constructeurs refusent de la réviser à crédit.

  *On pourrait passer par le passage muré*, suggère l'IA de la base dans ton oreillette. *Avec ton gilet chauffant, tu tiendrais deux heures.*
