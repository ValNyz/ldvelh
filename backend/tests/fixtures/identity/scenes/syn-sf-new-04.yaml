narration: |-
  Au pont 7, l'eau monte jusqu'aux chevilles. Une technicienne en ciré orange pompe à la main, seule.

  — Tu viens de la part d'Aurèle ? Moi, c'est Mina. Tiens, prends ce passe-coque, il ouvre les vannes du secteur.

  Elle sort de sa sacoche une deuxième carte de rationnement, vierge, et tu la glisses contre ta propre carte.

  — Pour le gamin. Il n'en a plus depuis que la Fraternité du Retour l'a recueilli. Et ne la montre pas à la Fraternité du Départ : ceux de la poupe valent encore moins que ceux du Retour.

  — Qui t'envoie, toi ?

  — La Guilde des Plongeurs. On doit atteindre la Salle des Vannes avant la nuit.

  *Une Fraternité de chaque côté du vaisseau*, soupire Vesper. *Il faudra que je mette mes fiches à jour.*
