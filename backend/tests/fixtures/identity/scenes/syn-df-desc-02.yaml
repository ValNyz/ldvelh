narration: |-
  La vieille femme aux bagues de fer se lève et va fermer la lucarne.

  — Le premier magistrat de la ville m'a fait dire que l'affaire était close, dit-elle. Ses sergents ont pendu un tanneur ce matin. La milice est contente, la ville aussi.

  Elle pose la main sur la lame à manche d'os, sans la saisir.

  — Ceux qui portaient ce masque ne sont pas des tanneurs. Cette engeance se cache depuis des années sous notre maison.

  En bas, dans l'abattoir, l'homme au tablier de cuir a cessé d'aiguiser. On n'entend plus que la grosse cloche, qui sonne l'heure. Puis la Doyenne se tait.

  *Elle parle de sa guilde comme d'une famille*, murmure Vespérine. *Les familles aussi enterrent leurs secrets à la cave.*
