- text: |-
    Ancelise Morvan t'a fait monter dans son cabinet, au-dessus des fosses. Par la lucarne, on voit les toits de Vargne fumer sous la pluie.

    — Tu as rapporté Mâchefer, dit-elle. Pose-le là. Et raconte.
