narration: |-
  Le contremaître moustachu pointe le menton vers la passerelle.

  — La cheffe de quart veut te voir avant le lancement. Elle n'aime pas attendre, et le Syndicat non plus.

  Tu reconnais la silhouette en haut des marches : la femme au casque rayé, qui t'a laissé entrer dans la baie il y a trois jours. Elle consulte sa tablette sans lever les yeux.

  — Tu as un cycle de retard, dit-elle. Le chef de quart de la baie 5 m'a appelée ce matin. Il jure que ta combinaison sort de son vestiaire et il veut la récupérer. Je lui ai répondu que la Baie de lancement 5 pouvait attendre la fin de mon quart.

  En bas, les arrimeurs se taisent pour écouter. La responsable referme sa tablette.

  — Et dis à ton syndicat que ce n'est pas moi qui ai signé le bon de sortie.

  *Elle t'a couvert au contrôle, la dernière fois*, rappelle la voix dans ton oreillette. *Le Syndicat des Arrimeurs, lui, n'a rien fait.*
