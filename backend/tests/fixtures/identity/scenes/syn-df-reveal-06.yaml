narration: |-
  Tu descends malgré tout. La procession s'est arrêtée devant l'Hospice des Ladres. En tête, un pénitent porte une bannière de toile grise ; quand le vent la déploie, tu lis les mots brodés en fil d'argent : Fraternité de l'Aube.

  Quand la file repart, quelque chose reste dans la boue. Tu reconnais la clé d'os volée la veille au cloître. Sur la tige, une inscription minuscule : Passe-Tombe.

  *La Fraternité*, murmure Isaure. *De mon vivant, ils enterraient les pestiférés. Aujourd'hui, je ne sais pas ce qu'ils enterrent. Corlay donnerait cher pour cette clé.*
