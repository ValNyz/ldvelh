narration: |-
  Le klaxon de quart retentit trois fois : alerte générale. Boussole agrippe ton bras.

  — C'est la Fraternité, dit-elle. Ils ont forcé les Archives.

  Tu cours. Dans la coursive, deux mécaniciens te dépassent, clés à la main ; l'Ordre des Mécaniciens a enfin choisi son camp.

  *Ils ont ouvert le coffret*, annonce Vesper, la voix tendue. *Celui des Fondateurs. Ils l'emportent vers le Pont Sept.*

  Tu vérifies machinalement ta carte de rationnement : rouge. Tous les accès sont coupés.
