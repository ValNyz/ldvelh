  narration: |-
    Dans la cour de la vieille forteresse, les chevaux sont sellés. Le chevalier au bras en écharpe regarde sa cousine monter en selle.

    — Si Morvaine vient avec toi, dit-il, la Ligue croira que la Maison s'est réconciliée. C'est faux, mais c'est utile.

    Sélène Morvaine ajuste ses gants.

    — Et si tu restais ici à soigner ton bras, Morvaine ? Pour une fois, laisse les femmes parler.

    Le seigneur de Brumecourt éclate d'un rire bref et te fait signe de partir. L'anneau pèse à ton doigt.

    *Une Morvaine devant, un Morvaine derrière*, résume Noctule.
