      Tu traverses la cour. Devant la chapelle, la cavalière en manteau de deuil t'attend, adossée au portail.

      — Mon cousin te fait confiance, dit Sélène. Moi, je veux juste comprendre pourquoi la Ligue recevrait une inconnue avec notre anneau au doigt.

      *Elle n'a pas dit « son » anneau. Elle a dit « notre »*, relève Noctule.
