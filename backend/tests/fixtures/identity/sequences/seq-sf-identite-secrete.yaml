      La navette de la Patrouille fédérale s'est détachée il y a une heure. Sur le pont, le mécanicien t'attend, assis sur une caisse.

      — Tu m'as couvert, tout à l'heure. Tu as dit à l'officier que j'étais à bord depuis dix ans.

      Il pousse vers toi une boîte à outils rouge, cabossée, fermée par un cadenas.

      — Garde-la. Ne l'ouvre pas. Si la Patrouille revient, jette-la dans le recycleur.

      Tu prends la boîte. Elle est plus lourde que des outils.

      *Il te fait porter son secret*, dit Sillage.
