  narration: |-
    La soute zéro sent la poussière et l'huile froide. Corvin y allume une lampe à piles.

    — La Flotte Fantôme existe encore, quelque part, dit-il. J'ai vécu deux ans dans ce trou à attendre un signe d'elle. Avec les codes de la boîte, elle pourrait sortir de l'ombre.

    L'ancien amiral passe la main sur une console morte.

    — Ou la Patrouille pourrait s'en servir pour la détruire. Je n'ai jamais su décider. C'est pour ça que je suis devenu mécanicien.

    *Corvin Hale vient de te confier une flotte*, murmure Sillage. *Et la capitaine vient de rappeler la passerelle.*
