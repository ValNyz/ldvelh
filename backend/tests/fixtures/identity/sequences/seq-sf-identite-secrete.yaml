  history:
  - text: |-
      Il est trois heures, cycle de nuit. Le vieux mécano éteint les turbines une à une, puis s'assoit à côté de toi.

      — Tu mérites la vérité. Je m'appelle Corvin Hale. Il y a vingt ans, je commandais la Flotte Fantôme, celle dont la Patrouille nie l'existence. Quand on m'a ordonné de bombarder une colonie, j'ai déserté.

      Il montre une trappe sous les turbines.

      — Là-dessous, il y a la soute zéro. Elle n'est sur aucun plan du cargo. Et ta boîte rouge contient les codes de la Flotte.

      Hale. Tu répètes le nom à voix basse.

      *Corvin Hale*, répète Sillage. *Je n'ai jamais rien lu à ce nom. Ils l'ont effacé.*
