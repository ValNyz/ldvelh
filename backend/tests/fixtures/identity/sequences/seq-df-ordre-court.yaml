    Dans la crypte de la commanderie, sous une dalle descellée, tu trouves un étui de cuir vide et un ruban blanc brodé d'un lys.

    — Les gens du Lys sont passés par ici, murmure Noctule. Ou on voudrait te le faire croire.

    Des pas descendent l'escalier. Ysambert de Vaux s'arrête sur la dernière marche, une lanterne à la main.

    — Tu as trouvé la cachette, dit-il. Et pas la bannière, je suppose. L'Ordre du Lys l'a prise : voilà ce que nous dirons au tournoi, et l'Ordre de la Lame Cendrée aura sa guerre.

    *Le vol, c'était lui*, souffle Noctule.
