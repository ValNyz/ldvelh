    — L'Ordre ose chercher notre bannière ? Les chevaliers en blanc rêvent de nous voir humiliés depuis vingt ans.

    Il se reprend, baisse la voix.

    — Si le Lys la trouve avant nous, l'Ordre sera la risée du tournoi. Mes frères me demanderont des comptes, et les Cendrés, comme dit le peuple, n'auront plus qu'à rendre leurs manteaux.

    Le Commandeur se tourne vers la fenêtre. Il ne te regarde plus.

    *Il a dit « la trouve », pas « la vole »*, relève Noctule. *Il sait où elle est.*
