  narration: |-
    La porte de la gargote s'ouvre sur quatre chevaliers en surcot blanc. Une chevalière au lys brodé s'avance jusqu'au comptoir.

    — Au nom de l'Ordre du Lys, nous cherchons les voleurs de la Bannière cendrée. Récompense pour toute information.

    La tenancière hausse un sourcil.

    — Vous aussi ? Les Cendrés sont passés ce matin avec la même question.

    — L'Ordre de la Lame Cendrée cherche de son côté, nous du nôtre, répond la chevalière. Le premier qui la trouve la garde.

    *Deux ordres, une bannière*, note Noctule. *Ça va mal finir.*
