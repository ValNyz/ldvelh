  narration: |-
    Dans la Salle des Cordes, la vieille femme aux mains goudronnées étale une carte du port sur la table.

    — La Guilde des Passeurs tient les pontons du nord, dit-elle. Ce sont les loyalistes. Nous, les Passeurs Libres de Vharn, on garde le sud et notre vieille halle. La guilde loyaliste n'a que douze barques, mais la Garde les protège.

    Elle pose le doigt sur le ponton sud.

    — Montre ton jeton à la chaîne sur le ponton sud, on te fera traverser. Et si un loyaliste te demande ton vieux jeton, donne-le-lui : il ne vaut plus rien chez nous.

    Varga replie la carte.

    *Les loyalistes ont un nom tout neuf qui est très vieux*, remarque Noctule.
