  history:
  - text: |-
      Le lendemain, une nouvelle affiche couvre les anciennes, au même endroit : la refondation de la Guilde des Passeurs, « fidèle au Margrave », signée par une poignée de passeurs restés loyaux. Elle délivre déjà des jetons au sceau de la Garde du Margrave.

      Ilse lit l'affiche par-dessus ton épaule et crache dans l'eau.

      — Ils nous volent même notre vieux nom. Tiens, prends ça.

      Elle te glisse dans la main un jeton gravé d'une chaîne brisée.

      — Les Passeurs Libres ne reconnaissent plus que celui-là. Ton vieux jeton de passage, jette-le, ou garde-le pour les loyalistes.

      *Deux guildes et deux jetons. Ne te trompe pas de poche*, dit Noctule.
