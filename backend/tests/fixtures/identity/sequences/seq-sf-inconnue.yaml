  narration: |-
    La Coursive C sent l'ozone et la soupe froide. Adossée à un panneau de maintenance, la femme au manteau t'attendait.

    — Tu l'as toujours ? demande-t-elle en regardant ta main. Le cylindre, je veux dire.

    Tu hoches la tête. L'inconnue relève son col trempé.

    — Alors garde-le encore un jour. Le Syndicat des Fileurs me cherche, et ils fouillent tout le monde sur le marché. La Douane ferme les yeux, comme d'habitude.

    *Une contrebandière*, conclut la voix dans ton oreillette. *Et toi, tu portes sa marchandise dans ce boyau puant.*
