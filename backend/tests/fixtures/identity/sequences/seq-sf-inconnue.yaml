  narration: |-
    Les étals du Marché de l'Anneau débordent sur l'allée centrale. Une femme au manteau de pluie te bouscule, s'excuse à peine, et tu sens un poids nouveau dans ta poche.

    — Garde-le au chaud, souffle-t-elle sans s'arrêter. Je reviendrai le chercher.

    Elle disparaît derrière un étal de fruits secs. Dans ta poche, tes doigts trouvent un cylindre métallique, tiède, pas plus long qu'un doigt. Au bout de l'allée, deux agents de la Douane orbitale remontent le marché à contre-courant.

    *Elle t'a choisi au hasard, ou pas*, note Sillage. *Je n'ai pas eu le temps de voir son visage.*
