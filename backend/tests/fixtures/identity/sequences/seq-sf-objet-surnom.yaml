  history:
  - text: |-
      Retour au chantier. Sur le râtelier, un scellant pend à son crochet, étiqueté au nom d'un autre soudeur. Tamsin t'attend avec une caisse ouverte.

      — La Fédération a fini par livrer, par Kessel Logistique. Tiens, un pistolet-scellant neuf. Tu gardes l'ancien en secours.

      Tu tiens maintenant deux outils presque identiques, un dans chaque main. Le neuf ne siffle pas, ne chauffe pas.

      *Je ne lui trouve aucun surnom*, regrette Sillage. *La Bouilloire reste ma préférée.*
