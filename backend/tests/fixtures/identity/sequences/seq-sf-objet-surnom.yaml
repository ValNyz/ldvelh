  narration: |-
    Une alarme de dépressurisation retentit sur le pont 4. Tu cours, le scellant neuf à la main. La brèche est large comme un poing.

    Le pistolet-scellant neuf tousse, crachote, et s'arrête : réservoir vide, jamais rempli à la livraison.

    *Sors la Bouilloire*, ordonne Sillage.

    Ton vieux pistolet siffle, chauffe, et colmate la brèche en huit secondes. Plus tard, à la Bouilloire, toute l'équipe paie sa tournée à l'outil cabossé.

    *Je le savais*, dit Sillage. *La Fédération des Soudeurs devrait me consulter.*
