    — Tu es venu, dit-il. La balise, tu peux l'éteindre.

    Mirelle est déjà à genoux devant lui, sa trousse ouverte. La médecin découpe le tissu du pantalon sans demander la permission.

    — La Compagnie m'a laissé tomber dans la ceinture, grogne le capitaine. Sans toi, je serais encore là-haut.

    *Bienvenue au Hangar 9, capitaine*, dit Sillage.
