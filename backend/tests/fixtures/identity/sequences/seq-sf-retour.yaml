    *Signal du capitaine Abasi*, annonce Sillage. *Six semaines, presque jour pour jour. Il appelle depuis la ceinture, mais le point de rendez-vous, c'est le Hangar 9.*

    Tu te redresses, la balise dans le poing. Tu revois le vieux capitaine, sa jambe de métal, sa poignée de main sèche. Il avait dit de venir au hangar et d'attendre.

    *La Compagnie Lysandre n'a émis aucune alerte*, ajoute Sillage. *Soit la Compagnie ne sait rien, soit elle se tait.*
