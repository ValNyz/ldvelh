name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ldvelh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      # Pinned + checksum-verified: an unpinned "latest" (v2.33.0+) silently
      # switched the default to SSL and broke this step for months.
      - name: Install dbmate
        env:
          DBMATE_VERSION: v2.36.0
          DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
        run: |
          curl -fsSL -o /usr/local/bin/dbmate "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  /usr/local/bin/dbmate" | sha256sum -c -
          chmod +x /usr/local/bin/dbmate

      # The CI Postgres service has no TLS: make sslmode explicit.
      - name: Apply DB migrations
        run: dbmate --migrations-dir ../db/migrations --no-dump-schema up
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test?sslmode=disable

      - name: Run all tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/benchmark \
            -o asyncio_mode=auto \
            --cov=. \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test
          JWT_SECRET: ci-test-secret
          DEBUG: "true"
          ENCRYPTION_KEY: "WkpQHs-KU7XuScnVGAxm35ucMGXCCGt1yLenNhtGqR0="

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
