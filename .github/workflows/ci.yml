name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ldvelh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      # Pinned + checksum-verified (db/dbmate-release.env): an unpinned "latest" (v2.33.0+)
      # silently switched the default to SSL and broke this step for months.
      - name: Install dbmate
        run: ../db/install-dbmate.sh ../db/dbmate-release.env /usr/local/bin/dbmate

      # The CI Postgres service has no TLS: make sslmode explicit.
      - name: Apply DB migrations
        run: dbmate --migrations-dir ../db/migrations --no-dump-schema up
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test?sslmode=disable

      - name: Lint pipeline and routes (complexity, unused imports)
        run: |
          pip install ruff==0.8.4
          ruff check --select C901,F401 --config "lint.mccabe.max-complexity = 15" pipeline/ api/routes.py workers/

      # Random per-run secrets: a value published in the repo is rejected by startup_checks.
      - name: Generate test secrets
        run: |
          jwt="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          key="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::$jwt"
          echo "::add-mask::$key"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Run all tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/benchmark \
            -o asyncio_mode=auto \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test
          REQUIRE_TEST_DB: "1"
          DEBUG: "true"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # E2E on the static export with a mocked API (tests/e2e/): no backend, no LLM.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: frontend/test-results/
          retention-days: 7

  docker-images:
    name: Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Catches Dockerfile breakage before a deploy; both images must run as non-root.
      # A dummy backend/.env must stay out of the image (/.dockerignore), checked below.
      - name: Build backend image (repo root context)
        run: |
          echo "JWT_SECRET=dummy-must-not-ship" > backend/.env
          docker build -f backend/Dockerfile -t ldvelh-backend .
          rm backend/.env
      - name: Build frontend image
        run: docker build -t ldvelh-frontend frontend
      - name: Images run as non-root, without local secrets or tests
        run: |
          for image in ldvelh-backend ldvelh-frontend; do
            uid="$(docker run --rm --entrypoint id "$image" -u)"
            echo "$image uid=$uid"
            test "$uid" != 0
          done
          docker run --rm --entrypoint sh ldvelh-backend -c 'test ! -e /app/.env && test ! -e /app/tests'
