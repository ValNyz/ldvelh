name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ldvelh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Apply DB schema
        run: psql -f ../schema.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: ldvelh_test

      - name: Run all tests with coverage
        run: |
          pytest tests/ \
            -o asyncio_mode=auto \
            --cov=. \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/ldvelh_test
          JWT_SECRET: ci-test-secret
          DEBUG: "true"
          ENCRYPTION_KEY: "WkpQHs-KU7XuScnVGAxm35ucMGXCCGt1yLenNhtGqR0="

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
